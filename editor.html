  <script>

    /* ==============================
       ELEMENTS
    ============================== */

    const hookInput =
      document.getElementById("hookInput");

    const hookOutput =
      document.getElementById("hookOutput");
const hookFont =
  document.getElementById("hookFont");
    const hookSize =
  document.getElementById("hookSize");

const hookSizeValue =
  document.getElementById("hookSizeValue");


const hookHeight =
  document.getElementById("hookHeight");

const hookHeightValue =
  document.getElementById("hookHeightValue");

    
    const imageInput =
      document.getElementById("imageInput");

    const previewImage =
      document.getElementById("previewImage");

    const imagePlaceholder =
      document.getElementById("imagePlaceholder");

    const videoPlayBtn =
      document.getElementById("videoPlayBtn");

    const exportBtn =
      document.getElementById("exportBtn");

    const templateAudio =
      document.getElementById("templateAudio");

    const currentTime =
      document.getElementById("currentTime");

    const totalTime =
      document.getElementById("totalTime");

    const progressFill =
      document.getElementById("progressFill");

    const editorStatus =
      document.getElementById("editorStatus");

    const editorPopup =
      document.getElementById("editorPopup");

    const popupCloseBtn =
      document.getElementById("popupCloseBtn");


    /* ==============================
       STATE
    ============================== */

    let selectedImage = null;

    let selectedImageUrl = null;

    let playing = false;

    let animationFrame = null;


    /* ==============================
       TEMPLATE TIMING
    ============================== */

    const REVEAL_START = 0.75;

    const REEL_END = 5.04;

    const REVEAL_DURATION =
      REEL_END - REVEAL_START;


    totalTime.textContent =
      formatTime(REEL_END);


    /* ==============================
       ARABIC DETECTION
    ============================== */

    function containsArabic(text) {

      return /[\u0600-\u06FF]/.test(text);

    }


    /* ==============================
       HOOK
    ============================== */

    function updateHook() {

      const value =
        hookInput.value.trim();


      if (!value) {

        hookOutput.textContent =
          "Your hook goes here";


        hookOutput.classList.remove(
          "arabic-hook"
        );


        hookOutput.dir =
          "ltr";


        return;

      }


      hookOutput.textContent =
        value;


      if (
        containsArabic(value)
      ) {

        hookOutput.classList.add(
          "arabic-hook"
        );


        hookOutput.dir =
          "rtl";

      } else {

        hookOutput.classList.remove(
          "arabic-hook"
        );


        hookOutput.dir =
          "ltr";

      }

    }


    const savedHook =
  localStorage.getItem("viral1s_hook_text");

if (savedHook !== null) {
  hookInput.value = savedHook;
}

hookInput.addEventListener(
  "input",
  () => {
    updateHook();

    localStorage.setItem(
      "viral1s_hook_text",
      hookInput.value
    );
  }
);

updateHook();

const savedHookSize =
  localStorage.getItem("reelflow_hook_size");

if (savedHookSize) {
  hookSize.value = savedHookSize;
}

function applyHookSize() {
  const size = Number(hookSize.value);

  hookOutput.style.fontSize =
    `${size}%`;

  hookSizeValue.textContent =
    `${size}%`;

  localStorage.setItem(
    "reelflow_hook_size",
    String(size)
  );
}

hookSize.addEventListener(
  "input",
  applyHookSize
);

applyHookSize();

function applyHookFont() {
  const fonts = {
  system: 'Arial, Helvetica, sans-serif',
  inter: 'Inter, Arial, sans-serif',
  georgia: 'Georgia, serif',
  courier: '"Courier New", monospace',

  cairo: '"Cairo", sans-serif',
  tajawal: '"Tajawal", sans-serif',
  "noto-kufi": '"Noto Kufi Arabic", sans-serif',
  amiri: '"Amiri", serif'
};

  
  hookOutput.style.fontFamily =
    fonts[hookFont.value] || fonts.system;

  localStorage.setItem(
    "reelflow_hook_font",
    hookFont.value
  );
}

const savedHookFont =
  localStorage.getItem("reelflow_hook_font");

if (savedHookFont) {
  hookFont.value = savedHookFont;
}

hookFont.addEventListener(
  "change",
  applyHookFont
);

applyHookFont();

    
const savedHookHeight =
  localStorage.getItem("reelflow_hook_height");

if (savedHookHeight) {
  hookHeight.value = savedHookHeight;
}

function applyHookHeight() {
  const height = Number(hookHeight.value);

  const safePadding = 4;

const adjustablePadding =
  6 * (height / 40);

const padding =
  safePadding + adjustablePadding;

  hookOutput.style.minHeight = "";

  hookOutput.style.paddingTop =
    `${padding}px`;

  hookOutput.style.paddingBottom =
    `${padding}px`;

  hookHeightValue.textContent =
    `${height}px`;

  localStorage.setItem(
    "reelflow_hook_height",
    String(height)
  );
}

    
hookHeight.addEventListener(
  "input",
  applyHookHeight
);

applyHookHeight();

    
    /* ==============================
       IMAGE
    ============================== */


const imageUploadBox =
  document.getElementById("imageUploadBox");

const imageUploadIcon =
  document.getElementById("imageUploadIcon");

const imageUploadTitle =
  document.getElementById("imageUploadTitle");

const imageUploadName =
  document.getElementById("imageUploadName");

    
    imageInput.addEventListener(
      "change",
      () => {

        selectedImage =
          imageInput.files[0];


        if (!selectedImage) {
          return;
        }
imageUploadBox.classList.add("has-image");

imageUploadIcon.textContent = "✓";

imageUploadTitle.textContent =
  "Change Image";

imageUploadName.textContent =
  selectedImage.name;

        if (selectedImageUrl) {

          URL.revokeObjectURL(
            selectedImageUrl
          );

        }


        selectedImageUrl =
          URL.createObjectURL(
            selectedImage
          );


        previewImage.src =
          selectedImageUrl;


        previewImage.style.display =
          "block";


        imagePlaceholder.style.display =
          "none";


        resetVisuals();


        editorPopup.classList.remove(
          "show"
        );


        editorStatus.textContent =
          "";

      }
    );


    /* ==============================
       PLAY BUTTON
    ============================== */

    videoPlayBtn.addEventListener(
      "click",
      togglePreview
    );


    async function togglePreview() {

      if (!selectedImage) {

        editorPopup.classList.add(
          "show"
        );

        return;

      }


      if (playing) {

        stopPreview();

      } else {

        await startPreview();

      }

    }


    /* ==============================
       START PREVIEW
    ============================== */

    async function startPreview() {

      playing = true;


      videoPlayBtn.classList.add(
        "is-playing"
      );


      videoPlayBtn.textContent =
        "❚❚";


      templateAudio.pause();


      templateAudio.currentTime =
        0;


      resetVisuals();


      try {

        await templateAudio.play();

      } catch (error) {

        console.error(error);


        playing = false;


        videoPlayBtn.classList.remove(
          "is-playing"
        );


        videoPlayBtn.textContent =
          "▶";


        editorStatus.textContent =
          "Music could not start.";


        return;

      }


      previewLoop();

    }


    /* ==============================
       STOP PREVIEW
    ============================== */

    function stopPreview() {

      playing = false;


      templateAudio.pause();


      videoPlayBtn.classList.remove(
        "is-playing"
      );


      videoPlayBtn.textContent =
        "▶";


      if (animationFrame) {

        cancelAnimationFrame(
          animationFrame
        );

      }

    }


    /* ==============================
       LOOP
    ============================== */

    function previewLoop() {

      if (!playing) {
        return;
      }


      const time =
        templateAudio.currentTime;


      updatePreview(time);


      /*
        When image reaches 100%
        reel starts again.
      */

      if (
        time >=
        REEL_END - 0.03
      ) {

        templateAudio.currentTime =
          0;


        resetVisuals();


        templateAudio
          .play()
          .catch(() => {});

      }


      animationFrame =
        requestAnimationFrame(
          previewLoop
        );

    }


    /* ==============================
       IMAGE REVEAL
    ============================== */

    function updatePreview(time) {

      currentTime.textContent =
        formatTime(time);


      const videoProgress =
        Math.min(
          time / REEL_END,
          1
        );


      progressFill.style.width =
        `${videoProgress * 100}%`;


      /*
        Before reveal
      */

      if (
        time < REVEAL_START
      ) {

        previewImage.style.opacity =
          "0";


        previewImage.style.filter =
          "brightness(0)";


        return;

      }


      /*
        Reveal from dark
        to 100% visible.
      */

      const revealProgress =
        Math.min(
          (
            time -
            REVEAL_START
          ) /
          REVEAL_DURATION,
          1
        );


      previewImage.style.opacity =
        revealProgress;


      previewImage.style.filter =
        `brightness(${revealProgress})`;

    }


    /* ==============================
       RESET
    ============================== */

    function resetVisuals() {

      currentTime.textContent =
        "0:00";


      progressFill.style.width =
        "0%";


      if (previewImage.src) {

        previewImage.style.opacity =
          "0";


        previewImage.style.filter =
          "brightness(0)";

      }

    }


    /* ==============================
       POPUP
    ============================== */

    popupCloseBtn.addEventListener(
      "click",
      () => {

        editorPopup.classList.remove(
          "show"
        );


        imageInput.click();

      }
    );


    editorPopup.addEventListener(
      "click",
      (event) => {

        if (
          event.target ===
          editorPopup
        ) {

          editorPopup.classList.remove(
            "show"
          );

        }

      }
    );


    /* ==============================
       EXPORT
    ============================== */

   EXPORT
============================== */

const exportModal =
  document.getElementById("exportModal");

const exportModalClose =
  document.getElementById("exportModalClose");

const exportCancelBtn =
  document.getElementById("exportCancelBtn");

const exportConfirmBtn =
  document.getElementById("exportConfirmBtn");

const qualityOptions =
  document.querySelectorAll(
    ".export-quality-option"
  );

const size480 =
  document.getElementById("size480");

const size720 =
  document.getElementById("size720");

const size1080 =
  document.getElementById("size1080");

const exportProgressView =
  document.getElementById("exportProgressView");

const exportProgressText =
  document.getElementById("exportProgressText");

const exportProgressBar =
  document.getElementById("exportProgressBar");

const exportProgressPercent =
  document.getElementById("exportProgressPercent");

const exportStopBtn =
  document.getElementById("exportStopBtn");

let exportCancelled = false;
    exportStopBtn.addEventListener(
  "click",
  () => {
    exportCancelled = true;

    exportStopBtn.disabled = true;
    exportStopBtn.textContent = "Cancelling...";

    exportProgressText.textContent =
      "Stopping export...";
  }
);
let selectedExportQuality = 1080;


/* =========================
   ESTIMATED FILE SIZE
========================= */

function estimateVideoSize(
  videoBitrate
) {

  const duration = 5.04;

  const audioBitrate =
    128000;

  const totalBits =
    duration *
    (
      videoBitrate +
      audioBitrate
    );

  const megaBytes =
    totalBits /
    8 /
    1024 /
    1024;

  return `~${megaBytes.toFixed(1)} MB`;

}


size480.textContent =
  estimateVideoSize(
    1800000
  );

size720.textContent =
  estimateVideoSize(
    3500000
  );

size1080.textContent =
  estimateVideoSize(
    6500000
  );


/* =========================
   OPEN EXPORT MODAL
========================= */

exportBtn.addEventListener(
  "click",
  () => {

    if (!selectedImage) {

      editorPopup.classList.add(
        "show"
      );

      return;
    }

    exportModal.classList.add(

);


/* =========================
   QUALITY SELECT
========================= */

qualityOptions.forEach(
  (option) => {

    option.addEventListener(
      "click",
      () => {

        qualityOptions.forEach(
          (item) => {
            item.classList.remove(

          }
        );

        option.classList.add(
          "selected"

        selectedExportQuality =
          Number(
            option.dataset.quality

      }

  }
);


/* =========================
   CLOSE MODAL
========================= */

function closeExportModal() {

  exportModal.classList.remove(
    "show"
  );

}


exportModalClose.addEventListener(
  "click",
  closeExportModal
);


exportCancelBtn.addEventListener(
  "click",
  closeExportModal
);


exportModal.addEventListener(
  "click",
  (event) => {

    if (
      event.target ===
      exportModal
    ) {

      closeExportModal();

    }

  }
);


/* =========================
   CONFIRM EXPORT
========================= */

exportConfirmBtn.addEventListener(
  "click",
  async () => {

    exportCancelled = false;
exportStopBtn.disabled = false;
exportStopBtn.textContent = "Cancel Export";
    exportProgressView.classList.add("show");

    exportConfirmBtn.style.display = "none";
    exportCancelBtn.style.display = "none";

    exportProgressBar.style.width = "0%";
    exportProgressPercent.textContent = "0%";
    exportProgressText.textContent = "Preparing...";

    await exportReel();

  }
);




    async function exportReel() {

  if (!selectedImage) {
    editorPopup.classList.add("show");
    return;
  }

  const originalButtonText =
    exportBtn.textContent;

  exportBtn.disabled = true;
  exportBtn.textContent = "Exporting...";

  editorStatus.textContent =
    "Creating video on your device...";

  let imageBitmap = null;
  let hookBitmap = null;
  let audioContext = null;

  try {

    const M = window.Mediabunny;

    if (!M) {
      throw new Error(
        "Video engine is still loading. Try again."
      );
    }

    const {
      Output,
      Mp4OutputFormat,
      BufferTarget,
      CanvasSource,
      AudioBufferSource,
      Quality
    } = M;


    /* =========================
       VIDEO SETTINGS
    ========================= */

    let VIDEO_WIDTH;
let VIDEO_HEIGHT;

if (selectedExportQuality === 480) {
  VIDEO_WIDTH = 480;
  VIDEO_HEIGHT = 854;
} else if (selectedExportQuality === 720) {
  VIDEO_WIDTH = 720;
  VIDEO_HEIGHT = 1280;
} else {
  VIDEO_WIDTH = 1080;
  VIDEO_HEIGHT = 1920;
}

const IMAGE_SIZE = VIDEO_WIDTH;

    const FPS = 30;
    const REEL_END = 5.04;

    const revealStart =
      typeof REVEAL_START === "number"
        ? REVEAL_START
        : 0.75;


    /* =========================
       CREATE HOOK IMAGE
    ========================= */

    const hookBlob =
  await createHookImage(
    VIDEO_WIDTH
  );

    hookBitmap =
      await createImageBitmap(
        hookBlob
      );


    /* =========================
       LOAD USER IMAGE
    ========================= */

    imageBitmap =
      await createImageBitmap(
        selectedImage
      );


    /* =========================
       HOOK POSITION
    ========================= */

    const previewWidth =
      reelPreview
        .getBoundingClientRect()
        .width;

    const previewHookHeight =
      hookOutput
        .getBoundingClientRect()
        .height;

    const exportHookHeight =
      Math.round(
        previewHookHeight *
        (
          VIDEO_WIDTH /
          previewWidth
        )
      );

    const emptySpace =
      Math.max(
        0,
        Math.floor(
          (
            VIDEO_HEIGHT -
            IMAGE_SIZE -
            exportHookHeight
          ) / 2
        )
      );

    const hookY =
      emptySpace;

    const imageY =
      emptySpace +
      exportHookHeight;


    /* =========================
       EXPORT CANVAS
    ========================= */

    const canvas =
      document.createElement(
        "canvas"
      );

    canvas.width =
      VIDEO_WIDTH;

    canvas.height =
      VIDEO_HEIGHT;

    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );


    /* =========================
       MP4 OUTPUT
    ========================= */

    const output =
      new Output({
        format:
          new Mp4OutputFormat({
            fastStart: "in-memory"
          }),

        target:
          new BufferTarget()
      });


    /* =========================
       VIDEO ENCODER
    ========================= */
let videoBitrate;

if (selectedExportQuality === 480) {
  videoBitrate = 1800000;
} else if (selectedExportQuality === 720) {
  videoBitrate = 3500000;
} else {
  videoBitrate = 6500000;
          }

    
    const videoSource =
      new CanvasSource(
        canvas,
        {
          codec: "avc",

          quality:
  new Quality({
    
    bitrate: videoBitrate
  })
        }
      );

    output.addVideoTrack(
      videoSource
    );


    /* =========================
       AUDIO ENCODER
    ========================= */

    const audioSource =
      new AudioBufferSource({
        codec: "aac",

        quality:
          new Quality({
            bitrate: 128000
          })
      });

    output.addAudioTrack(
      audioSource
    );


    /* =========================
       VIDEO METADATA
    ========================= */

    output.setMetadataTags({
      title:
        "Viral1s Reel",

      artist:
        "Viral1s"
    });


    /* =========================
       LOAD MUSIC
    ========================= */

    const musicResponse =
      await fetch(
        "./template1.mp3"
      );

    if (!musicResponse.ok) {
      throw new Error(
        "Could not load music"
      );
    }

    const musicArrayBuffer =
      await musicResponse
        .arrayBuffer();

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    audioContext =
      new AudioContextClass();

    const fullAudio =
      await audioContext
        .decodeAudioData(
          musicArrayBuffer
        );


    /* =========================
       CUT MUSIC TO 5.04s
    ========================= */

    const audioDuration =
      Math.min(
        REEL_END,
        fullAudio.duration
      );

    const audioFrames =
      Math.floor(
        audioDuration *
        fullAudio.sampleRate
      );

    const reelAudio =
      audioContext.createBuffer(
        fullAudio
          .numberOfChannels,

        audioFrames,

        fullAudio.sampleRate
      );

    for (
      let channel = 0;
      channel <
      fullAudio.numberOfChannels;
      channel++
    ) {

      const sourceData =
        fullAudio
          .getChannelData(
            channel
          );

      reelAudio.copyToChannel(
        sourceData.subarray(
          0,
          audioFrames
        ),
        channel
      );

    }


    /* =========================
       IMAGE CROP
    ========================= */

    const sourceWidth =
      imageBitmap.width;

    const sourceHeight =
      imageBitmap.height;

    const cropSize =
      Math.min(
        sourceWidth,
        sourceHeight
      );

    const sourceX =
      (
        sourceWidth -
        cropSize
      ) / 2;

    const sourceY =
      (
        sourceHeight -
        cropSize
      ) / 2;


    /* =========================
       START MP4
    ========================= */

    await output.start();


    /* =========================
       ADD AUDIO
    ========================= */

    const audioPromise =
      audioSource
        .add(
          reelAudio
        )
        .then(
          () => {
            audioSource.close();
          }
        );


    /* =========================
       CREATE VIDEO FRAMES
    ========================= */

    const totalFrames =
      Math.ceil(
        REEL_END *
        FPS
      );

    for (
      let frame = 0;
      frame < totalFrames;
      frame++
    ) {

      if (exportCancelled) {
  throw new Error("EXPORT_CANCELLED");
      }

      const timestamp =
        frame / FPS;

      const duration =
        Math.min(
          1 / FPS,
          REEL_END -
          timestamp
        );


      /* BLACK BACKGROUND */

      ctx.globalAlpha = 1;

      ctx.fillStyle =
        "#000000";

      ctx.fillRect(
        0,
        0,
        VIDEO_WIDTH,
        VIDEO_HEIGHT
      );


      /* HOOK */
ctx.fillStyle = "#ffffff";

ctx.fillRect(
  0,
  hookY,
  VIDEO_WIDTH,
  exportHookHeight
);
      
const hookText =
  hookInput.value.trim() ||
  "Your hook goes here";

const hookStyle =
  getComputedStyle(hookOutput);

const hookScale =
  VIDEO_WIDTH / previewWidth;

const hookFontSize =
  parseFloat(hookStyle.fontSize) *
  hookScale;

const hookLineHeight =
  parseFloat(hookStyle.lineHeight) *
  hookScale;

const hookPaddingLeft =
  parseFloat(hookStyle.paddingLeft) *
  hookScale;

const hookPaddingRight =
  parseFloat(hookStyle.paddingRight) *
  hookScale;

ctx.fillStyle = "#080808";

ctx.font =
  `${hookStyle.fontWeight} ${hookFontSize}px ${hookStyle.fontFamily}`;

ctx.textAlign = "center";
ctx.textBaseline = "middle";

ctx.direction =
  containsArabic(hookText)
    ? "rtl"
    : "ltr";

drawWrappedText(
  ctx,
  hookText,
  VIDEO_WIDTH / 2,
  hookY + exportHookHeight / 2,
  VIDEO_WIDTH -
    hookPaddingLeft -
    hookPaddingRight,
  hookLineHeight
);

      /* IMAGE REVEAL */

      let imageOpacity = 0;

      if (
        timestamp >=
        revealStart
      ) {

        imageOpacity =
          Math.min(
            1,
            (
              timestamp -
              revealStart
            ) /
            (
              REEL_END -
              revealStart
            )
          );

      }


      ctx.globalAlpha =
        imageOpacity;

      ctx.drawImage(
        imageBitmap,

        sourceX,
        sourceY,
        cropSize,
        cropSize,

        0,
        imageY,
        IMAGE_SIZE,
        IMAGE_SIZE
      );

      ctx.globalAlpha = 1;


      /* SEND FRAME TO ENCODER */
if (exportCancelled) {
  throw new Error("EXPORT_CANCELLED");
    }
      await videoSource.add(
        timestamp,
        duration
      );


      /* PROGRESS */

      const progress =
        Math.round(
          (
            (frame + 1) /
            totalFrames
          ) * 100
        );

      editorStatus.textContent =
        `Exporting on device... ${progress}%`;


exportProgressBar.style.width =
  `${progress}%`;

exportProgressPercent.textContent =
  `${progress}%`;

exportProgressText.textContent =
  `Exporting ${selectedExportQuality}p...`;

        
    }


    videoSource.close();

    await audioPromise;

    await output.finalize();


    /* =========================
       GET MP4
    ========================= */

    const mp4Buffer =
      output.target.buffer;

    if (!mp4Buffer) {
      throw new Error(
        "MP4 could not be created"
      );
    }

    const videoBlob =
      new Blob(
        [mp4Buffer],
        {
          type: "video/mp4"
        }
      );

    const videoUrl =
      URL.createObjectURL(
        videoBlob
      );


    /* =========================
       DOWNLOAD
    ========================= */

    const downloadLink =
      document.createElement(
        "a"
      );

    downloadLink.href =
      videoUrl;

    downloadLink.download =
      "viral1s-reel.mp4";

    document.body.appendChild(
      downloadLink
    );

    downloadLink.click();

    downloadLink.remove();

    setTimeout(
      () => {
        URL.revokeObjectURL(
          videoUrl
        );
      },
      5000
    );


    editorStatus.textContent =
      "Reel exported ✓";

exportProgressBar.style.width = "100%";
exportProgressPercent.textContent = "100%";
exportProgressText.textContent = "Export complete ✓";

setTimeout(() => {

  closeExportModal();

  exportProgressView.classList.remove("show");

  exportConfirmBtn.style.display = "";
  exportCancelBtn.style.display = "";

}, 800);
  } catch (error) {
if (error.message === "EXPORT_CANCELLED") {

  editorStatus.textContent =
    "Export cancelled";

  exportProgressText.textContent =
    "Export cancelled";

  exportProgressView.classList.remove("show");

  exportConfirmBtn.style.display = "";
  exportCancelBtn.style.display = "";

  return;
}
    console.error(
      "Client export error:",
      error
    );

    editorStatus.textContent =
      "Export failed. Try again.";

    alert(
      error?.message ||
      "Export failed"
    );


  } finally {

    if (imageBitmap) {
      imageBitmap.close();
    }

    if (hookBitmap) {
      hookBitmap.close();
    }

    if (audioContext) {
      try {
        await audioContext.close();
      } catch {}
    }

    exportBtn.disabled = false;

    exportBtn.textContent =
      originalButtonText;

  }

}
    
/* ==============================
   CREATE HOOK IMAGE
============================== */


        async function createHookImage(targetWidth) {

  const hookRect =
    hookOutput.getBoundingClientRect();

  const exportScale =
  targetWidth / hookRect.width;

  const canvas =
    await html2canvas(
      hookOutput,
      {
        backgroundColor: "#ffffff",
        scale: exportScale,
        useCORS: true,
        logging: false
      }
    );

  return new Promise(
    (resolve, reject) => {

      canvas.toBlob(
        (blob) => {

          if (blob) {
            resolve(blob);
          } else {
            reject(
              new Error(
                "Could not create hook"
              )
            );
          }

        },
        "image/png"
      );

    }
  );

}

/* ==============================
   WRAP HOOK TEXT
============================== */


function drawWrappedText(
  ctx,
  text,
  centerX,
  centerY,
  maxWidth,
  lineHeight
) {

  const paragraphs =
    text.split("\n");

  const lines = [];

  paragraphs.forEach(
    (paragraph) => {

      if (!paragraph.trim()) {
        lines.push("");
        return;
      }

      const words =
        paragraph.trim().split(/\s+/);

      let currentLine = "";

      words.forEach(
        (word) => {

          const testLine =
            currentLine
              ? currentLine + " " + word
              : word;

          const width =
            ctx.measureText(
              testLine
            ).width;

          if (
            width > maxWidth &&
            currentLine
          ) {

            lines.push(
              currentLine
            );

            currentLine =
              word;

          } else {

            currentLine =
              testLine;

          }

        }
      );

      if (currentLine) {
        lines.push(
          currentLine
        );
      }

    }
  );

  const totalHeight =
    (lines.length - 1) *
    lineHeight;

  let y =
    centerY -
    totalHeight / 2;

  lines.forEach(
    (line) => {

      if (line) {
        ctx.fillText(
          line,
          centerX,
          y
        );
      }

      y +=
        lineHeight;

    }
  );
}

    
    /* ==============================
       TIME FORMAT
    ============================== */

    function formatTime(seconds) {

      const safeSeconds =
        Math.max(
          0,
          seconds || 0
        );


      const minutes =
        Math.floor(
          safeSeconds / 60
        );


      const secs =
        Math.floor(
          safeSeconds % 60
        );


      return (
        minutes +
        ":" +
        secs
          .toString()
          .padStart(
            2,
            "0"
          )
      );

    }


const appLoader =
  document.getElementById("appLoader");

const loaderStartTime = performance.now();
const minimumLoaderTime = 400;

window.addEventListener(
  "load",
  () => {
    if (!appLoader) return;

    const elapsedTime =
      performance.now() - loaderStartTime;

    const remainingTime =
      Math.max(
        0,
        minimumLoaderTime - elapsedTime
      );

    setTimeout(() => {
      appLoader.classList.add("is-hidden");
    }, remainingTime);
  }
);


    
  </script>
