<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Product Background — Viral1s</title>
  <meta name="description" content="Upload a product photo and create a new AI background with Viral1s.">
  <link rel="canonical" href="https://viral1s.com/product-ai.html">
  <link rel="icon" type="image/png" href="viral1s-icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 0%, #20134c 0%, #0c0b19 42%, #07070d 100%);
      color: #fff;
    }

    .topbar {
      height: 68px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(8,8,16,.72);
      backdrop-filter: blur(15px);
    }

    .logo {
      height: 32px;
      width: auto;
      display: block;
    }

    .back {
      color: #aaa7b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .page {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: 35px 18px 50px;
    }

    .badge {
      width: fit-content;
      margin: 0 auto 13px;
      padding: 7px 12px;
      border: 1px solid rgba(151,111,255,.35);
      border-radius: 999px;
      background: rgba(122,74,255,.12);
      color: #bda8ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    h1 {
      text-align: center;
      font-size: clamp(29px, 8vw, 44px);
      line-height: 1.07;
      letter-spacing: -1.4px;
      margin-bottom: 11px;
    }

    .subtitle {
      max-width: 480px;
      margin: 0 auto 25px;
      text-align: center;
      color: #9996a8;
      font-size: 14px;
      line-height: 1.55;
    }

    .generator {
      padding: 16px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 20px;
      background: rgba(255,255,255,.045);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .label {
      display: block;
      margin: 0 0 8px 2px;
      color: #d4d1df;
      font-size: 13px;
      font-weight: 750;
    }

    .upload {
      position: relative;
      overflow: hidden;
      width: 100%;
      min-height: 160px;
      border: 1px dashed rgba(154,117,255,.45);
      border-radius: 15px;
      background: rgba(111,74,255,.07);
      cursor: pointer;
    }

    .upload-empty {
      min-height: 160px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .upload-icon {
      width: 45px;
      height: 45px;
      margin-bottom: 10px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(132,93,255,.16);
      color: #bda8ff;
      font-size: 23px;
    }

    .upload-title {
      color: #eeeaf8;
      font-size: 14px;
      font-weight: 750;
    }

    .upload-subtitle {
      margin-top: 5px;
      color: #706d7e;
      font-size: 11px;
    }

    #fileInput {
      display: none;
    }

    .preview {
      display: none;
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #0b0a12;
    }

    .preview img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .change {
      position: absolute;
      right: 10px;
      bottom: 10px;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 9px;
      background: rgba(10,9,17,.82);
      color: white;
      font-size: 11px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }

    .prompt-section {
      margin-top: 17px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 105px;
      resize: none;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      outline: none;
      padding: 14px;
      background: #11101c;
      color: white;
      font: inherit;
      font-size: 14px;
      line-height: 1.5;
      transition: .2s;
    }

    textarea:focus {
      border-color: #7857ff;
      box-shadow: 0 0 0 3px rgba(120,87,255,.12);
    }

    textarea::placeholder {
      color: #666373;
    }

    .generate {
      width: 100%;
      height: 52px;
      margin-top: 12px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #7657ff, #9a5cff);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .generate:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      display: none;
      padding: 20px 5px 5px;
      text-align: center;
      color: #aaa7b8;
      font-size: 13px;
    }

    .loader {
      width: 26px;
      height: 26px;
      margin: 0 auto 10px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: #8d6cff;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid rgba(255,85,85,.25);
      border-radius: 11px;
      background: rgba(255,60,60,.08);
      color: #ff9d9d;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .result {
      display: none;
      margin-top: 19px;
    }

    .result-title {
      margin: 0 0 9px 2px;
      color: #d4d1df;
      font-size: 13px;
      font-weight: 750;
    }

    .image-wrap {
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      background: #0b0a12;
      border: 1px solid rgba(255,255,255,.09);
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .download {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 50px;
      margin-top: 11px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 13px;
      background: rgba(255,255,255,.07);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 750;
    }

    .note {
      margin-top: 17px;
      color: #656270;
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
    }

    @media (min-width: 700px) {
      .page {
        padding-top: 50px;
      }

      .generator {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <a href="/">
    <img class="logo" src="viral1s-logo.webp" alt="Viral1s">
  </a>

  <a class="back" href="/">← Back</a>
</header>

<main class="page">

  <div class="badge">VIRAL1S PRODUCT AI</div>

  <h1>Put your product<br>anywhere.</h1>

  <p class="subtitle">
    Upload a photo, describe the new background and let AI create a new product scene.
  </p>

  <section class="generator">

    <span class="label">1. Upload your image</span>

    <label class="upload" for="fileInput">

      <div class="upload-empty" id="uploadEmpty">
        <div class="upload-icon">+</div>

        <div class="upload-title">
          Choose an image
        </div>

        <div class="upload-subtitle">
          JPG, PNG or WEBP
        </div>
      </div>

      <div class="preview" id="preview">
        <img id="previewImage" alt="Uploaded image">
        <div class="change">Change image</div>
      </div>

    </label>

    <input
      id="fileInput"
      type="file"
      accept="image/jpeg,image/png,image/webp"
    >

    <div class="prompt-section">

      <label class="label" for="prompt">
        2. Describe the new background
      </label>

      <textarea
        id="prompt"
        maxlength="1800"
        placeholder="Example: Place the product on a glossy black marble surface with soft golden studio lighting, luxury atmosphere and realistic shadows..."
      ></textarea>

    </div>

    <button class="generate" id="generateBtn">
      Generate New Background ✦
    </button>

    <div class="status" id="status">
      <div class="loader"></div>
      Creating your new image...
    </div>

    <div class="error" id="error"></div>

    <div class="result" id="result">

      <div class="result-title">
        Result
      </div>

      <div class="image-wrap">
        <img id="resultImage" alt="AI generated product image">
      </div>

      <a
        class="download"
        id="downloadBtn"
        download="viral1s-product-ai.jpg"
      >
        ↓ Download Image
      </a>

    </div>

  </section>

  <div class="note">
    AI editing may occasionally change small details of the original object.
  </div>

</main>

<script>

const API_URL =
  "https://viral1s-product-ai.lovgle-com.workers.dev/";

const fileInput =
  document.getElementById("fileInput");

const uploadEmpty =
  document.getElementById("uploadEmpty");

const preview =
  document.getElementById("preview");

const previewImage =
  document.getElementById("previewImage");

const promptInput =
  document.getElementById("prompt");

const generateBtn =
  document.getElementById("generateBtn");

const statusBox =
  document.getElementById("status");

const errorBox =
  document.getElementById("error");

const resultBox =
  document.getElementById("result");

const resultImage =
  document.getElementById("resultImage");

const downloadBtn =
  document.getElementById("downloadBtn");

let preparedImage = null;


/* =========================
   IMAGE UPLOAD
========================= */

fileInput.addEventListener("change", async () => {

  const file = fileInput.files[0];

  if (!file) return;

  errorBox.style.display = "none";
  resultBox.style.display = "none";

  try {

    previewImage.src =
      URL.createObjectURL(file);

    uploadEmpty.style.display = "none";
    preview.style.display = "block";

    preparedImage =
      await prepareImage(file);

  } catch (error) {

    preparedImage = null;

    showError(
      "This image could not be prepared. Try another image."
    );

  }

});


/* =========================
   RESIZE REFERENCE IMAGE
========================= */

async function prepareImage(file) {

  const bitmap =
    await createImageBitmap(file);

  const maxSize = 500;

  let width = bitmap.width;
  let height = bitmap.height;

  const scale =
    Math.min(
      maxSize / width,
      maxSize / height,
      1
    );

  width =
    Math.max(1, Math.round(width * scale));

  height =
    Math.max(1, Math.round(height * scale));

  const canvas =
    document.createElement("canvas");

  canvas.width = width;
  canvas.height = height;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    bitmap,
    0,
    0,
    width,
    height
  );

  bitmap.close();

  return await new Promise(
    (resolve, reject) => {

      canvas.toBlob(
        blob => {

          if (blob) {
            resolve(blob);
          } else {
            reject(
              new Error("Image conversion failed")
            );
          }

        },
        "image/jpeg",
        0.92
      );

    }
  );

}


/* =========================
   GENERATE
========================= */

generateBtn.addEventListener(
  "click",
  generateImage
);


async function generateImage() {

  const prompt =
    promptInput.value.trim();

  if (!preparedImage) {

    showError(
      "Upload an image first."
    );

    return;
  }

  if (!prompt) {

    showError(
      "Describe the background you want."
    );

    promptInput.focus();

    return;
  }

  errorBox.style.display = "none";
  resultBox.style.display = "none";

  statusBox.style.display = "block";

  generateBtn.disabled = true;
  generateBtn.textContent =
    "Generating...";


  try {

    const formData =
      new FormData();

    formData.append(
      "image",
      preparedImage,
      "reference.jpg"
    );

    formData.append(
      "prompt",
      prompt
    );


    const response =
      await fetch(
        API_URL,
        {
          method: "POST",
          body: formData
        }
      );


    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "The AI server returned an invalid response."
      );

    }


    if (
      !response.ok ||
      !data.success ||
      !data.image
    ) {

      throw new Error(
        data.error ||
        "Image generation failed."
      );

    }


    resultImage.src =
      data.image;

    downloadBtn.href =
      data.image;

    resultBox.style.display =
      "block";


    setTimeout(() => {

      resultBox.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });

    }, 100);


  } catch (error) {

    showError(
      error.message ||
      "Something went wrong. Please try again."
    );

  } finally {

    statusBox.style.display =
      "none";

    generateBtn.disabled =
      false;

    generateBtn.textContent =
      "Generate New Background ✦";

  }

}


/* =========================
   ERROR
========================= */

function showError(message) {

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";

}

</script>

</body>
</html>
