<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Viral1s Image Creator</title>

  <link
    rel="icon"
    type="image/png"
    href="viral1s-icon.png"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Noto+Kufi+Arabic:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070711;
      --panel: #11111d;
      --panel-2: #171724;
      --border: rgba(255,255,255,.09);
      --text: #ffffff;
      --muted: #858596;
      --purple: #7c5cff;
      --blue: #4d82ff;
      --danger: #ff667a;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(124,92,255,.18),
          transparent 34%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .hidden {
      display: none !important;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding:
        calc(7px + env(safe-area-inset-top))
        8px
        calc(7px + env(safe-area-inset-bottom));
    }

    /* =========================
       TOP
    ========================= */

    .topbar {
      flex: 0 0 auto;
      min-height: 50px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: rgba(17,17,29,.95);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 100px;
      height: auto;
    }

    .page-title {
      color: #c0b5ff;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .65px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .save-btn {
      justify-self: end;
      min-height: 36px;
      padding: 0 11px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );
      font-size: 9px;
      font-weight: 900;
    }

    .subbar {
      flex: 0 0 auto;
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(17,17,29,.94);
    }

    .sub-btn {
      min-height: 31px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #d3d3de;
      background: rgba(255,255,255,.035);
      font-size: 9px;
      font-weight: 850;
    }

    .sub-btn.lock {
      width: 38px;
      padding: 0;
      font-size: 15px;
    }

    .sub-btn.lock.active {
      border-color: rgba(124,92,255,.35);
      background: rgba(124,92,255,.13);
    }

    .sub-btn.reel {
      margin-left: auto;
      color: #fff;
      border-color: rgba(124,92,255,.25);
      background:
        linear-gradient(
          135deg,
          rgba(124,92,255,.22),
          rgba(77,130,255,.15)
        );
    }

    /* =========================
       WORKSPACE
    ========================= */

    .workspace {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .canvas-area {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 0;
    }

    .canvas-shell {
      position: relative;
      width: min(78vw, 43dvh, 370px);
      max-width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 18px 48px rgba(0,0,0,.32);
    }

    #editorCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }

    .selection-label {
      position: absolute;
      left: 9px;
      top: 9px;
      z-index: 3;
      display: none;
      padding: 5px 8px;
      border-radius: 999px;
      color: #fff;
      background: rgba(7,7,17,.72);
      backdrop-filter: blur(8px);
      font-size: 8px;
      font-weight: 850;
      pointer-events: none;
    }

    .selection-label.show {
      display: block;
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
      background: rgba(17,17,29,.98);
    }

    .context-strip {
      height: 65px;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      align-items: stretch;
      gap: 3px;
      padding: 5px 6px;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
      touch-action: pan-x;
    }

    .context-strip::-webkit-scrollbar {
      display: none;
    }

    .context-btn {
      flex: 0 0 60px;
      width: 60px;
      border: 0;
      border-radius: 9px;
      color: #9999aa;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .context-btn:active {
      color: #fff;
      background: rgba(124,92,255,.12);
    }

    .context-icon {
      color: #e5e5ec;
      font-size: 18px;
      line-height: 1;
    }

    .context-name {
      max-width: 56px;
      overflow: hidden;
      font-size: 7px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .main-tools {
      height: 67px;
      display: grid;
      grid-template-columns: repeat(4,1fr);
    }

    .main-tool {
      position: relative;
      border: 0;
      border-right: 1px solid rgba(255,255,255,.055);
      color: #707080;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .main-tool:last-child {
      border-right: 0;
    }

    .main-tool.active {
      color: #fff;
      background:
        linear-gradient(
          180deg,
          rgba(124,92,255,.13),
          rgba(124,92,255,.035)
        );
    }

    .main-tool.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 28%;
      right: 28%;
      height: 2px;
      background:
        linear-gradient(
          90deg,
          var(--purple),
          var(--blue)
        );
    }

    .main-icon {
      font-size: 20px;
      line-height: 1;
    }

    .main-label {
      font-size: 8px;
      font-weight: 850;
    }

    /* DETAIL TOOL */

    .detail-tool {
      min-height: 132px;
      padding: 9px;
    }

    .detail-head {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
    }

    .detail-title {
      flex: 1;
      font-size: 10px;
      font-weight: 900;
    }

    .detail-head button {
      min-height: 31px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 8px;
      font-weight: 900;
    }

    .cancel-btn {
      border: 1px solid var(--border);
      color: #bdbdca;
      background: rgba(255,255,255,.035);
    }

    .done-btn {
      border: 0;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );
    }

    .detail-body {
      min-height: 72px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-row + .control-row {
      margin-top: 9px;
    }

    .control-label {
      min-width: 54px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
    }

    .control-row input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: var(--purple);
    }

    .control-row input[type="color"] {
      width: 52px;
      height: 35px;
      padding: 2px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d0d16;
    }

    .control-row input[type="text"],
    .control-row select {
      flex: 1;
      min-width: 0;
      height: 35px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      color: #fff;
      background: #0d0d16;
      font-size: 9px;
    }

    .control-value {
      min-width: 45px;
      color: #d8d8e3;
      font-size: 8px;
      font-weight: 900;
      text-align: right;
    }

    /* =========================
       MODALS
    ========================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(7px);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(100%, 470px);
      max-height: 82dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 17px;
      background: #11111d;
      box-shadow: 0 25px 70px rgba(0,0,0,.5);
    }

    .modal-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      flex: 1;
      font-size: 11px;
      font-weight: 900;
    }

    .modal-close {
      width: 33px;
      height: 33px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      background: rgba(255,255,255,.035);
    }

    .modal-body {
      min-height: 0;
      overflow-y: auto;
      padding: 10px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 8px;
    }

    .project-card {
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(255,255,255,.025);
    }

    .project-preview {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      object-fit: cover;
      border-radius: 8px;
      background: #0b0b12;
    }

    .project-name {
      margin: 6px 2px;
      color: #d5d5df;
      font-size: 8px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .project-actions {
      display: grid;
      grid-template-columns: 1fr 32px;
      gap: 5px;
    }

    .project-open,
    .project-delete {
      height: 31px;
      border-radius: 7px;
      font-size: 8px;
      font-weight: 850;
    }

    .project-open {
      border: 0;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );
    }

    .project-delete {
      border: 1px solid rgba(255,102,122,.2);
      color: #ff8292;
      background: rgba(255,102,122,.05);
    }

    .empty-projects {
      grid-column: 1/-1;
      padding: 26px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 9px;
    }

    .confirm {
      width: min(100%, 360px);
      padding: 16px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      background: #11111d;
    }

    .confirm h3 {
      margin-bottom: 7px;
      font-size: 13px;
    }

    .confirm p {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.55;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 14px;
    }

    .confirm-actions button {
      height: 38px;
      border-radius: 9px;
      font-size: 9px;
      font-weight: 900;
    }

    .confirm-cancel {
      border: 1px solid var(--border);
      color: #cccbd6;
      background: rgba(255,255,255,.035);
    }

    .confirm-ok {
      border: 0;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );
    }

    .file-input {
      display: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 30000;
      max-width: calc(100vw - 24px);
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: #fff;
      background: rgba(17,17,29,.97);
      font-size: 9px;
      font-weight: 800;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%,10px);
      transition: .2s;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%,0);
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 900px) {
      .app {
        max-width: 1180px;
        margin: 0 auto;
        padding: 16px 22px;
        gap: 10px;
      }

      .brand img {
        width: 130px;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0,1fr) 390px;
        gap: 14px;
      }

      .canvas-area {
        border: 1px solid var(--border);
        border-radius: 17px;
        background: rgba(17,17,29,.55);
      }

      .canvas-shell {
        width: min(62vh,610px);
      }

      .controls {
        align-self: end;
      }

      .projects-grid {
        grid-template-columns: repeat(3,minmax(0,1fr));
      }
    }

    @media (max-width: 370px) {
      .brand img {
        width: 86px;
      }

      .page-title {
        font-size: 8px;
      }

      .canvas-shell {
        width: min(73vw,40dvh,320px);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="topbar">

    <a
      class="brand"
      href="index.html"
      aria-label="Viral1s Home"
    >
      <img
        src="viral1s-logo.webp"
        alt="Viral1s"
      />
    </a>

    <div class="page-title">
      Image Creator
    </div>

    <button
      id="saveBtn"
      class="save-btn"
      type="button"
    >
      Save Image
    </button>

  </header>


  <div class="subbar">

    <button
      id="newBtn"
      class="sub-btn"
      type="button"
    >
      New
    </button>

    <button
      id="lockBtn"
      class="sub-btn lock"
      type="button"
      title="Lock selected element"
    >
      🔓
    </button>

    <button
      id="useReelBtn"
      class="sub-btn reel"
      type="button"
    >
      Use in Reel
    </button>

  </div>


  <main class="workspace">

    <section class="canvas-area">

      <div
        id="canvasShell"
        class="canvas-shell"
      >

        <canvas
          id="editorCanvas"
          width="1080"
          height="1080"
        ></canvas>

        <div
          id="selectionLabel"
          class="selection-label"
        ></div>

      </div>

    </section>


    <section class="controls">

      <div
        id="detailTool"
        class="detail-tool hidden"
      >

        <div class="detail-head">

          <button
            id="detailCancel"
            class="cancel-btn"
            type="button"
          >
            Cancel
          </button>

          <div
            id="detailTitle"
            class="detail-title"
          >
            Tool
          </div>

          <button
            id="detailDone"
            class="done-btn"
            type="button"
          >
            Done
          </button>

        </div>

        <div
          id="detailBody"
          class="detail-body"
        ></div>

      </div>


      <div
        id="contextStrip"
        class="context-strip"
      ></div>


      <div
        id="mainTools"
        class="main-tools"
      >

        <button
          class="main-tool"
          data-main="projects"
          type="button"
        >
          <span class="main-icon">▣</span>
          <span class="main-label">Projects</span>
        </button>

        <button
          class="main-tool"
          data-main="text"
          type="button"
        >
          <span class="main-icon">T</span>
          <span class="main-label">Text</span>
        </button>

        <button
          class="main-tool"
          data-main="image"
          type="button"
        >
          <span class="main-icon">▧</span>
          <span class="main-label">Image</span>
        </button>

        <button
          class="main-tool active"
          data-main="background"
          type="button"
        >
          <span class="main-icon">◩</span>
          <span class="main-label">Background</span>
        </button>

      </div>

    </section>

  </main>

</div>


<input
  id="backgroundInput"
  class="file-input"
  type="file"
  accept="image/*"
/>

<input
  id="imageInput"
  class="file-input"
  type="file"
  accept="image/*"
/>

<input
  id="replaceInput"
  class="file-input"
  type="file"
  accept="image/*"
/>


<div
  id="projectsModal"
  class="modal-backdrop"
>

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">
        My Projects
      </div>

      <button
        id="closeProjects"
        class="modal-close"
        type="button"
      >
        ×
      </button>

    </div>

    <div class="modal-body">

      <div
        id="projectsGrid"
        class="projects-grid"
      ></div>

    </div>

  </div>

</div>


<div
  id="confirmModal"
  class="modal-backdrop"
>

  <div class="confirm">

    <h3 id="confirmTitle">
      Are you sure?
    </h3>

    <p id="confirmText"></p>

    <div class="confirm-actions">

      <button
        id="confirmCancel"
        class="confirm-cancel"
        type="button"
      >
        Cancel
      </button>

      <button
        id="confirmOk"
        class="confirm-ok"
        type="button"
      >
        Continue
      </button>

    </div>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>
/* =========================================
   VIRAL1S SIMPLE IMAGE CREATOR
========================================= */

const SIZE = 1080;

const canvas =
  document.getElementById("editorCanvas");

const ctx =
  canvas.getContext("2d");

const selectionLabel =
  document.getElementById("selectionLabel");

const contextStrip =
  document.getElementById("contextStrip");

const mainTools =
  document.getElementById("mainTools");

const detailTool =
  document.getElementById("detailTool");

const detailTitle =
  document.getElementById("detailTitle");

const detailBody =
  document.getElementById("detailBody");

const detailDone =
  document.getElementById("detailDone");

const detailCancel =
  document.getElementById("detailCancel");

const backgroundInput =
  document.getElementById("backgroundInput");

const imageInput =
  document.getElementById("imageInput");

const replaceInput =
  document.getElementById("replaceInput");

const saveBtn =
  document.getElementById("saveBtn");

const newBtn =
  document.getElementById("newBtn");

const lockBtn =
  document.getElementById("lockBtn");

const useReelBtn =
  document.getElementById("useReelBtn");

const projectsModal =
  document.getElementById("projectsModal");

const closeProjects =
  document.getElementById("closeProjects");

const projectsGrid =
  document.getElementById("projectsGrid");

const confirmModal =
  document.getElementById("confirmModal");

const confirmTitle =
  document.getElementById("confirmTitle");

const confirmText =
  document.getElementById("confirmText");

const confirmCancel =
  document.getElementById("confirmCancel");

const confirmOk =
  document.getElementById("confirmOk");

const toast =
  document.getElementById("toast");


let db = null;

let currentMainTool =
  "background";

let currentProjectId =
  null;

let selected =
  null;

let dirty =
  false;

let confirmAction =
  null;

let autosaveTimer =
  null;

let toolBackup =
  null;

let detailDoneAction =
  null;

let imageCache =
  new Map();


let state = createEmptyState();


function createEmptyState() {

  return {
    background: null,

    image: null,

    texts: []
  };
}


/* =========================================
   FONTS
========================================= */

const FONT_MAP = {
  system:
    'Arial, Helvetica, sans-serif',

  inter:
    'Inter, Arial, sans-serif',

  georgia:
    'Georgia, serif',

  courier:
    '"Courier New", monospace',

  cairo:
    '"Cairo", sans-serif',

  tajawal:
    '"Tajawal", sans-serif',

  "noto-kufi":
    '"Noto Kufi Arabic", sans-serif',

  amiri:
    '"Amiri", serif'
};


const FONT_OPTIONS = `
  <optgroup label="English Fonts">
    <option value="system">System</option>
    <option value="inter">Inter</option>
    <option value="georgia">Georgia</option>
    <option value="courier">Courier New</option>
  </optgroup>

  <optgroup label="الخطوط العربية">
    <option value="cairo">Cairo</option>
    <option value="tajawal">Tajawal</option>
    <option value="noto-kufi">Noto Kufi Arabic</option>
    <option value="amiri">Amiri</option>
  </optgroup>
`;


/* =========================================
   HELPERS
========================================= */

function showToast(message) {

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      () => {
        toast.classList.remove(
          "show"
        );
      },
      1900
    );
}


function cloneState(value) {

  return JSON.parse(
    JSON.stringify(value)
  );
}


function getSelectedObject() {

  if (!selected) {
    return null;
  }

  if (
    selected.type === "image"
  ) {
    return state.image;
  }

  if (
    selected.type === "text"
  ) {
    return state.texts.find(
      text =>
        text.id === selected.id
    ) || null;
  }

  return null;
}


function markChanged() {

  dirty = true;

  renderCanvas();

  renderContext();

  updateLockButton();

  scheduleAutosave();
}


function makeId() {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {
    return crypto.randomUUID();
  }

  return (
    "v1_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2)
  );
}


function isArabic(text) {

  return /[\u0600-\u06FF]/.test(
    text || ""
  );
}


/* =========================================
   IMAGE LOADING
========================================= */

function dataUrlToImage(src) {

  if (!src) {
    return Promise.resolve(null);
  }

  if (
    imageCache.has(src)
  ) {
    return Promise.resolve(
      imageCache.get(src)
    );
  }

  return new Promise(
    (resolve,reject) => {

      const image =
        new Image();

      image.onload =
        () => {

          imageCache.set(
            src,
            image
          );

          resolve(image);
        };

      image.onerror =
        reject;

      image.src = src;
    }
  );
}


function fileToDataURL(file) {

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(file);
    }
  );
}


/* =========================================
   RENDER
========================================= */

async function renderCanvas() {

  ctx.clearRect(
    0,
    0,
    SIZE,
    SIZE
  );

  ctx.fillStyle =
    "#ffffff";

  ctx.fillRect(
    0,
    0,
    SIZE,
    SIZE
  );


  /* BACKGROUND */

  if (state.background) {

    try {

      const background =
        await dataUrlToImage(
          state.background
        );

      if (background) {

        ctx.drawImage(
          background,
          0,
          0,
          SIZE,
          SIZE
        );
      }

    } catch {}
  }


  /* MAIN IMAGE */

  if (
    state.image &&
    state.image.src
  ) {

    try {

      const image =
        await dataUrlToImage(
          state.image.src
        );

      if (image) {

        const width =
          image.width *
          state.image.scale;

        const height =
          image.height *
          state.image.scale;

        ctx.save();

        ctx.globalAlpha =
          state.image.opacity ?? 1;

        ctx.drawImage(
          image,
          state.image.x -
            width / 2,
          state.image.y -
            height / 2,
          width,
          height
        );

        ctx.restore();


        if (
          selected &&
          selected.type === "image"
        ) {

          drawSelectionBox(
            state.image.x -
              width / 2,
            state.image.y -
              height / 2,
            width,
            height
          );
        }
      }

    } catch {}
  }


  /* TEXTS */

  for (
    const text of state.texts
  ) {

    drawTextObject(
      text,
      Boolean(
        selected &&
        selected.type === "text" &&
        selected.id === text.id
      )
    );
  }


  updateSelectionLabel();
}


function drawTextObject(
  text,
  selectedNow
) {

  const family =
    FONT_MAP[text.fontKey] ||
    FONT_MAP.system;

  ctx.save();

  ctx.font =
    `${text.weight || 700} ${text.size}px ${family}`;

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.direction =
    isArabic(text.text)
      ? "rtl"
      : "ltr";

  if (
    text.shadow &&
    text.shadow.enabled
  ) {

    ctx.shadowColor =
      text.shadow.color;

    ctx.shadowBlur =
      text.shadow.blur;

    ctx.shadowOffsetX =
      text.shadow.offset;

    ctx.shadowOffsetY =
      text.shadow.offset;
  }


  if (
    text.strokeWidth > 0
  ) {

    ctx.lineWidth =
      text.strokeWidth;

    ctx.strokeStyle =
      text.strokeColor;

    ctx.lineJoin =
      "round";

    ctx.strokeText(
      text.text,
      text.x,
      text.y
    );
  }


  ctx.fillStyle =
    text.color;

  ctx.fillText(
    text.text,
    text.x,
    text.y
  );


  if (selectedNow) {

    const metrics =
      ctx.measureText(
        text.text || " "
      );

    const width =
      metrics.width + 34;

    const height =
      text.size * 1.35;

    drawSelectionBox(
      text.x - width / 2,
      text.y - height / 2,
      width,
      height
    );
  }

  ctx.restore();
}


function drawSelectionBox(
  x,
  y,
  width,
  height
) {

  ctx.save();

  ctx.strokeStyle =
    "#7c5cff";

  ctx.lineWidth = 4;

  ctx.setLineDash([
    12,
    8
  ]);

  ctx.strokeRect(
    x,
    y,
    width,
    height
  );

  ctx.restore();
}


function updateSelectionLabel() {

  const object =
    getSelectedObject();

  if (!object) {

    selectionLabel.classList.remove(
      "show"
    );

    return;
  }

  selectionLabel.textContent =
    selected.type === "image"
      ? "Image selected"
      : "Text selected";

  selectionLabel.classList.add(
    "show"
  );
}


/* =========================================
   CANVAS SELECTION
========================================= */

canvas.addEventListener(
  "pointerdown",
  event => {

    const rect =
      canvas.getBoundingClientRect();

    const x =
      (
        event.clientX -
        rect.left
      ) *
      SIZE /
      rect.width;

    const y =
      (
        event.clientY -
        rect.top
      ) *
      SIZE /
      rect.height;


    /* TEXT FIRST */

    for (
      let i =
        state.texts.length - 1;
      i >= 0;
      i--
    ) {

      const text =
        state.texts[i];

      const family =
        FONT_MAP[text.fontKey] ||
        FONT_MAP.system;

      ctx.save();

      ctx.font =
        `${text.weight || 700} ${text.size}px ${family}`;

      const metrics =
        ctx.measureText(
          text.text || " "
        );

      ctx.restore();

      const width =
        metrics.width + 50;

      const height =
        text.size * 1.6;

      if (
        x >=
          text.x -
          width / 2 &&
        x <=
          text.x +
          width / 2 &&
        y >=
          text.y -
          height / 2 &&
        y <=
          text.y +
          height / 2
      ) {

        selected = {
          type: "text",
          id: text.id
        };

        currentMainTool =
          "text";

        activateMainTool(
          "text"
        );

        renderCanvas();

        renderContext();

        updateLockButton();

        return;
      }
    }


    /* IMAGE */

    if (
      state.image &&
      state.image.src
    ) {

      dataUrlToImage(
        state.image.src
      ).then(
        image => {

          if (!image) {
            return;
          }

          const width =
            image.width *
            state.image.scale;

          const height =
            image.height *
            state.image.scale;

          if (
            x >=
              state.image.x -
              width / 2 &&
            x <=
              state.image.x +
              width / 2 &&
            y >=
              state.image.y -
              height / 2 &&
            y <=
              state.image.y +
              height / 2
          ) {

            selected = {
              type: "image"
            };

            currentMainTool =
              "image";

            activateMainTool(
              "image"
            );

          } else {

            selected = null;
          }

          renderCanvas();

          renderContext();

          updateLockButton();
        }
      );

      return;
    }


    selected = null;

    renderCanvas();

    renderContext();

    updateLockButton();
  }
);

  name,
  action
) {

    contextButton(

      name,

    )
  );
}


function renderContext() {

  if (
    !detailTool.classList.contains(
      "hidden"
    )
  ) {
    return;
  }

  contextStrip.innerHTML = "";


  /* PROJECTS */

  if (
    currentMainTool ===
    "projects"
  ) {

    addContext(
      "▣",
      "My Projects",
      openProjects
    );

    return;
  }


  /* BACKGROUND */

  if (
    currentMainTool ===
    "background"
  ) {

    addContext(
      "＋",
      state.background
        ? "Replace"
        : "Background",
      () =>
        backgroundInput.click()
    );

    return;
  }


  /* IMAGE */

  if (
    currentMainTool ===
    "image"
  ) {

    if (!state.image) {

      addContext(
        "＋",
        "Image",
        () =>
          imageInput.click()
      );

      return;
    }

    addContext(
      "↻",
      "Replace",
      () =>
        replaceInput.click()
    );

    addContext(
      "✥",
      "Position",
      openImagePosition
    );

    addContext(
      "↔",
      "Size",
      openImageSize
    );

    addContext(
      "⌫",
      "Delete",
      deleteImage
    );

    return;
  }


  /* TEXT */

  if (
    currentMainTool ===
    "text"
  ) {

    const text =
      selected &&
      selected.type === "text"
        ? getSelectedObject()
        : null;


    if (!text) {

      if (
        state.texts.length < 2
      ) {

        addContext(
          "＋",
          "Text",
          addText
        );
      }


      state.texts.forEach(
        (item,index) => {

          addContext(
            "T",
            `Text ${index + 1}`,
            () => {

              selected = {
                type: "text",
                id: item.id
              };

              renderCanvas();

              renderContext();

              updateLockButton();
            }
          );
        }
      );

      return;
    }


    addContext(
      "✎",
      "Edit",
      openTextEdit
    );

    addContext(
      "✥",
      "Position",
      openTextPosition
    );

    addContext(
      "↔",
      "Size",
      openTextSize
    );

    addContext(
      "Aa",
      "Font",
      openTextFont
    );

    addContext(
      "●",
      "Color",
      openTextColor
    );

    addContext(
      "◉",
      "Border",
      openTextBorder
    );

    addContext(
      "◌",
      "Shadow",
      openTextShadow
    );

    addContext(
      "⌫",
      "Delete",
      deleteText
    );
  }
}

) {

    renderCanvas();

  detailTool.classList.add(
    "hidden"

  contextStrip.classList.remove(
    "hidden"

  mainTools.classList.remove(
    "hidden"
  );

  detailBody.innerHTML = "";

  detailDoneAction = null;

  toolBackup = null;

  renderContext();
}

   BACKGROUND
========================================= */

backgroundInput.addEventListener(
  "change",
  async () => {

    const file =
      backgroundInput.files[0];

    if (!file) {
      return;
    }

    try {

      state.background =
        await createSquareBackground(
          file
        );

      imageCache.clear();

      markChanged();

      showToast(
        "Background added"
      );

    } catch (error) {

      console.error(error);

      showToast(
        "Could not add background"
      );
    }

    backgroundInput.value = "";
  }
);


async function createSquareBackground(
  file
) {

  const src =
    await fileToDataURL(file);

  const image =
    await dataUrlToImage(src);

  const temp =
    document.createElement(
      "canvas"
    );

  temp.width =
    SIZE;

  temp.height =
    SIZE;

  const tempCtx =
    temp.getContext("2d");

  const scale =
    Math.max(
      SIZE / image.width,
      SIZE / image.height
    );

  const width =
    image.width *
    scale;

  const height =
    image.height *
    scale;

  const x =
    (SIZE - width) / 2;

  const y =
    (SIZE - height) / 2;

  tempCtx.drawImage(
    image,
    x,
    y,
    width,
    height
  );

  return temp.toDataURL(
    "image/jpeg",
    .95
  );
}

   IMAGE
========================================= */

imageInput.addEventListener(
  "change",
  async () => {

    const file =
      imageInput.files[0];

    if (!file) {
      return;
    }

    await addMainImage(
      file
    );

    imageInput.value = "";
  }
);


async function addMainImage(file) {

  try {

    const src =
      await fileToDataURL(file);

    const image =
      await dataUrlToImage(
        src
      );

    const max =
      SIZE * .55;

    const scale =
      Math.min(
        max / image.width,
        max / image.height,
        1
      );

    state.image = {
      src,
      x: SIZE / 2,
      y: SIZE / 2,
      scale,
      opacity: 1,
      locked: false
    };

    selected = {
      type: "image"
    };

    currentMainTool =
      "image";

    activateMainTool(
      "image"
    );

    markChanged();

  } catch (error) {

    console.error(error);

    showToast(
      "Could not add image"
    );
  }
}


replaceInput.addEventListener(
  "change",
  async () => {

    const file =
      replaceInput.files[0];

    if (
      !file ||
      !state.image
    ) {
      return;
    }

    try {

      const src =
        await fileToDataURL(file);

      await dataUrlToImage(src);

      state.image.src =
        src;

      imageCache.delete(
        state.image.src
      );

      selected = {
        type: "image"
      };

      markChanged();

      showToast(
        "Image replaced"
      );

    } catch {

      showToast(
        "Could not replace image"
      );
    }

    replaceInput.value = "";
  }
);

  if (!state.image) {

  state.image = null;

  selected = null;

  const text = {
    id: makeId(),

      state.texts.length * 120,

    fontKey: "system",

    strokeColor: "#000000",
    strokeWidth: 0,
    shadow: {
      enabled: false,
      color: "#000000",
      blur: 0,
      offset: 0

  state.texts.push(

  selected = {

      <div class="control-row">

        <span class="control-label">
          Blur
        </span>

        <input
          id="shadowBlur"
          type="range"
          min="0"
          max="60"
          value="${text.shadow.blur}"
        >

        <span
          id="shadowBlurValue"
          class="control-value"
        >
          ${text.shadow.blur}
        </span>

      </div>

      <div class="control-row">

        <span class="control-label">
          Distance
        </span>

        <input
          id="shadowOffset"
          type="range"
          min="0"
          max="50"
          value="${text.shadow.offset}"
        >

        <span
          id="shadowOffsetValue"
          class="control-value"
        >
          ${text.shadow.offset}
        </span>

      </div>

      <div class="control-row">

        <span class="control-label">
          Color
        </span>

        <input
          id="shadowColor"
          type="color"
          value="${text.shadow.color}"
        >

      </div>
    `
  );

  const blur =
    document.getElementById(
      "shadowBlur"
    );

  const offset =
    document.getElementById(
      "shadowOffset"
    );

  const color =
    document.getElementById(
      "shadowColor"
    );

  const blurValue =
    document.getElementById(
      "shadowBlurValue"
    );

  const offsetValue =
    document.getElementById(
      "shadowOffsetValue"
    );

  function apply() {

    text.shadow.blur =
      Number(
        blur.value
      );

    text.shadow.offset =
      Number(
        offset.value
      );

    text.shadow.color =
      color.value;

    text.shadow.enabled =
      text.shadow.blur > 0 ||
      text.shadow.offset > 0;

    blurValue.textContent =
      blur.value;

    offsetValue.textContent =
      offset.value;

    renderCanvas();
  }

  blur.addEventListener(
    "input",
    apply
  );

  offset.addEventListener(
    "input",
    apply
  );

  color.addEventListener(
    "input",
    apply
  );
}


/* =========================================
   GENERIC POSITION / SIZE
========================================= */

function openPositionTool(
  object,
  title
) {

  if (
    !object ||
    object.locked
  ) {
    return;
  }

  openDetailTool(
    title,
    `
      <div class="control-row">

        <span class="control-label">
          Left / Right
        </span>

        <input
          id="positionX"
          type="range"
          min="0"
          max="100"
          value="${
            Math.round(
              object.x /
              SIZE *
              100
            )
          }"
        >

        <span
          id="positionXValue"
          class="control-value"
        ></span>

      </div>

      <div class="control-row">

        <span class="control-label">
          Up / Down
        </span>

        <input
          id="positionY"
          type="range"
          min="0"
          max="100"
          value="${
            Math.round(
              object.y /
              SIZE *
              100
            )
          }"
        >

        <span
          id="positionYValue"
          class="control-value"
        ></span>

      </div>
    `
  );

  const x =
    document.getElementById(
      "positionX"
    );

  const y =
    document.getElementById(
      "positionY"
    );

  const xv =
    document.getElementById(
      "positionXValue"
    );

  const yv =
    document.getElementById(
      "positionYValue"
    );

  function apply() {

    object.x =
      Number(
        x.value
      ) /
      100 *
      SIZE;

    object.y =
      Number(
        y.value
      ) /
      100 *
      SIZE;

    xv.textContent =
      `${x.value}%`;

    yv.textContent =
      `${y.value}%`;

    renderCanvas();
  }

  x.addEventListener(
    "input",
    apply
  );

  y.addEventListener(
    "input",
    apply
  );

  apply();
}


function openScaleTool(
  object,
  title,
  min,
  max
) {

  if (
    !object ||
    object.locked
  ) {
    return;
  }

  openDetailTool(
    title,
    `
      <div class="control-row">

        <span class="control-label">
          Size
        </span>

        <input
          id="genericScale"
          type="range"
          min="${min}"
          max="${max}"
          value="${
            Math.round(
              object.scale *
              100
            )
          }"
        >

        <span
          id="genericScaleValue"
          class="control-value"
        ></span>

      </div>
    `
  );

  const slider =
    document.getElementById(
      "genericScale"
    );

  const value =
    document.getElementById(
      "genericScaleValue"
    );

  function apply() {

    object.scale =
      Number(
        slider.value
      ) / 100;

    value.textContent =

  }

/* =========================================
   LOCK
========================================= */

function updateLockButton() {

  const object =
    getSelectedObject();

  if (!object) {

    lockBtn.textContent =
      "🔓";

    lockBtn.classList.remove(
      "active"
    );

    return;
  }

  lockBtn.textContent =
    object.locked
      ? "🔒"
      : "🔓";

  lockBtn.classList.toggle(
    "active",
    Boolean(
      object.locked
    )
  );
}


lockBtn.addEventListener(
  "click",
  () => {

    const object =
      getSelectedObject();

    if (!object) {

      showToast(
        "Select Image or Text first"
      );

      return;
    }

    object.locked =
      !object.locked;

    markChanged();

    showToast(
      object.locked
        ? "Element locked"
        : "Element unlocked"
    );
  }
);


/* =========================================
   NEW
========================================= */

newBtn.addEventListener(
  "click",
  () => {

    askConfirm(
      "Start a new image?",
      "Your current working image will be cleared.",
      resetProject
    );
  }
);


function resetProject() {

  state =
    createEmptyState();

  selected = null;

  currentProjectId =
    null;

  dirty = false;

  currentMainTool =
    "background";

  saveBtn.textContent =
    "Save Image";

/* =========================================
   CONFIRM
========================================= */

function askConfirm(
  title,
  message,
  action
) {

  confirmTitle.textContent =
    title;

  confirmText.textContent =
    message;

  confirmAction =
    action;

  confirmModal.classList.add(
    "show"
  );
}


function closeConfirmModal() {

  confirmModal.classList.remove(
    "show"
  );

  confirmAction = null;
}


confirmCancel.addEventListener(
  "click",

confirmOk.addEventListener(

/* =========================================
   INDEXED DB
========================================= */

function openDatabase() {

  return new Promise(
    (resolve,reject) => {

      const request =
        indexedDB.open(
          "viral1s_simple_creator",
          1
        );

      request.onupgradeneeded =
        () => {

          const database =
            request.result;

          if (
            !database.objectStoreNames.contains(
              "projects"
            )
          ) {

            database.createObjectStore(
              "projects",
              {
                keyPath: "id"
              }
            );
          }

          if (
            !database.objectStoreNames.contains(
              "working"
            )
          ) {

            database.createObjectStore(
              "working",
              {
                keyPath: "id"
              }
            );
          }

          if (
            !database.objectStoreNames.contains(
              "reel_transfer"
            )
          ) {

            database.createObjectStore(
              "reel_transfer",
              {
                keyPath: "id"
              }
            );
          }
        };

      request.onsuccess =
        () => resolve(
          request.result
        );

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


function dbPut(
  store,
  value
) {

  return new Promise(
    (resolve,reject) => {

      const transaction =
        db.transaction(
          store,
          "readwrite"
        );

      const request =
        transaction
          .objectStore(store)
          .put(value);

      request.onsuccess =
        () => resolve();

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


function dbGet(
  store,
  key
) {

  return new Promise(
    (resolve,reject) => {

      const transaction =
        db.transaction(
          store,
          "readonly"
        );

      const request =
        transaction
          .objectStore(store)
          .get(key);

      request.onsuccess =
        () => resolve(
          request.result
        );

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


function dbGetAll(store) {

  return new Promise(
    (resolve,reject) => {

      const transaction =
        db.transaction(
          store,
          "readonly"
        );

      const request =
        transaction
          .objectStore(store)
          .getAll();

      request.onsuccess =
        () => resolve(
          request.result || []
        );

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


function dbDelete(
  store,
  key
) {

  return new Promise(
    (resolve,reject) => {

      const transaction =
        db.transaction(
          store,
          "readwrite"
        );

      const request =
        transaction
          .objectStore(store)
          .delete(key);

      request.onsuccess =
        () => resolve();

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


/* =========================================
   AUTO SAVE
========================================= */

function scheduleAutosave() {

  if (!db) {
    return;
  }

  clearTimeout(
    autosaveTimer
  );

  autosaveTimer =
    setTimeout(
      saveWorkingSession,
      300
    );
}


async function saveWorkingSession() {

  if (!db) {
    return;
  }

  try {

    await dbPut(
      "working",
      {
        id: "current",
        state:
          cloneState(state),
        projectId:
          currentProjectId,
        mainTool:
          currentMainTool,
        selected:
          selected
            ? cloneState(
                selected
              )
            : null,
        dirty,
        updatedAt:
          Date.now()
      }
    );

  } catch (error) {

    console.error(
      "Autosave error:",
      error
    );
  }
}


async function restoreWorkingSession() {

  if (!db) {
    return false;
  }

  const session =
    await dbGet(
      "working",
      "current"
    );

  if (
    !session ||
    !session.state
  ) {
    return false;
  }

  state =
    session.state;

  currentProjectId =
    session.projectId ||
    null;

  currentMainTool =
    session.mainTool ||
    "background";

  selected =
    session.selected ||
    null;

  dirty =
    Boolean(
      session.dirty
    );

  saveBtn.textContent =
    currentProjectId
      ? "Update Image"
      : "Save Image";

  activateMainTool(
    currentMainTool
  );

  await renderCanvas();

  renderContext();

  updateLockButton();

  return true;
}


async function clearWorkingSession() {

  if (!db) {
    return;
  }

  try {

    await dbDelete(
      "working",
      "current"
    );

  } catch {}
}


/* =========================================
   SAVE PROJECT
========================================= */

saveBtn.addEventListener(
  "click",
  saveProject
);


async function saveProject() {

  if (!db) {

    showToast(
      "Storage is not ready"
    );

    return;
  }

  const updating =
    Boolean(
      currentProjectId
    );

  saveBtn.disabled =
    true;

  saveBtn.textContent =
    updating
      ? "Updating..."
      : "Saving...";

  try {

    selected = null;

    await renderCanvas();

    const id =
      currentProjectId ||
      makeId();

    let old = null;

    if (
      currentProjectId
    ) {

      old =
        await dbGet(
          "projects",
          currentProjectId
        );
    }

    const preview =
      canvas.toDataURL(
        "image/jpeg",
        .76
      );

    await dbPut(
      "projects",
      {
        id,
        name:
          old?.name ||
          `Image ${new Date().toLocaleDateString()}`,
        state:
          cloneState(state),
        preview,
        createdAt:
          old?.createdAt ||
          Date.now(),
        updatedAt:
          Date.now()
      }
    );

    currentProjectId =
      id;

    dirty =
      false;

    saveBtn.textContent =
      "Update Image";

    await saveWorkingSession();

    showToast(
      updating
        ? "Image updated ✓"
        : "Image saved ✓"
    );

  } catch (error) {

    console.error(error);

    saveBtn.textContent =
      currentProjectId
        ? "Update Image"
        : "Save Image";

    showToast(
      "Could not save image"
    );
  }

  saveBtn.disabled =
    false;

  renderCanvas();
}


/* =========================================
   PROJECTS
========================================= */

async function openProjects() {

  await renderProjects();

  projectsModal.classList.add(
    "show"
  );
}


closeProjects.addEventListener(
  "click",
  () => {

    projectsModal.classList.remove(
      "show"
    );
  }
);


async function renderProjects() {

  projectsGrid.innerHTML = "";

  const projects =
    await dbGetAll(
      "projects"
    );

  projects.sort(
    (a,b) =>
      b.updatedAt -
      a.updatedAt
  );

  if (!projects.length) {

    projectsGrid.innerHTML =
      `
        <div class="empty-projects">
          No saved projects yet.
        </div>
      `;

    return;
  }

  projects.forEach(
    project => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "project-card";

      const preview =
        document.createElement(
          "img"
        );

      preview.className =
        "project-preview";

      preview.src =
        project.preview;

      preview.alt =
        "Saved Viral1s project";

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "project-name";

      name.textContent =
        project.name;

      const actions =
        document.createElement(
          "div"
        );

      actions.className =
        "project-actions";

      const open =
        document.createElement(
          "button"
        );

      open.className =
        "project-open";

      open.type =
        "button";

      open.textContent =
        "Open";

      open.addEventListener(
        "click",
        () => {

          askConfirm(
            "Open this project?",
            "Your current working image will be replaced.",
            () =>
              loadProject(
                project.id
              )
          );
        }
      );

      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "project-delete";

      remove.type =
        "button";

      remove.textContent =
        "×";

      remove.addEventListener(
        "click",
        () => {

          askConfirm(
            "Delete project?",
            "This saved project will be permanently removed from this device.",
            async () => {

              await dbDelete(
                "projects",
                project.id
              );

              await renderProjects();

              showToast(
                "Project deleted"
              );
            }
          );
        }
      );

      actions.append(
        open,
        remove
      );

      card.append(
        preview,
        name,
        actions
      );

      projectsGrid.appendChild(
        card
      );
    }
  );
}


async function loadProject(id) {

  const project =
    await dbGet(
      "projects",
      id
    );

  if (!project) {
    return;
  }

  state =
    cloneState(
      project.state
    );

  currentProjectId =
    project.id;

  selected =
    null;

  dirty =
    false;

  currentMainTool =
    "projects";

  saveBtn.textContent =
    "Update Image";

  projectsModal.classList.remove(
    "show"
  );

  activateMainTool(
    "projects"
  );

  imageCache.clear();

  await renderCanvas();

  renderContext();

  updateLockButton();

  await saveWorkingSession();

  showToast(
    "Project opened"
  );
}


/* =========================================
   USE IN REEL
========================================= */

useReelBtn.addEventListener(
  "click",
  () => {

    askConfirm(
      "Use this image in your reel?",
      "A 1080×1080 copy will be sent to the Viral1s Reel Editor.",
      sendToReel
    );
  }
);


async function sendToReel() {

  if (!db) {
    return;
  }

  try {

    selected = null;

    await renderCanvas();

    await saveWorkingSession();

    const blob =
      await new Promise(
        resolve => {

          canvas.toBlob(
            resolve,
            "image/png"
          );
        }
      );

    await dbPut(
      "reel_transfer",
      {
        id: "current",
        blob,
        createdAt:
          Date.now()
      }
    );

    window.location.href =
      "editor.html?from=image-creator";

  } catch (error) {

    console.error(error);

    showToast(
      "Could not send image"
    );
  }
}


/* =========================================
   INIT
========================================= */

async function init() {

  try {

    db =
      await openDatabase();

    await document.fonts.ready;

    const restored =
      await restoreWorkingSession();

    if (!restored) {

      await renderCanvas();

      renderContext();

      updateLockButton();
    }

  } catch (error) {

    console.error(error);

    await renderCanvas();

    renderContext();

    showToast(
      "Local storage unavailable"
    );
  }
}


init();
</script>
