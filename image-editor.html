<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Viral1s Image Creator</title>

<link rel="icon" type="image/png" href="viral1s-icon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<link
  href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Noto+Kufi+Arabic:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap"
  rel="stylesheet"
>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #070711;
  --panel: #11111d;
  --panel2: #161624;
  --panel3: #0d0d16;
  --border: rgba(255,255,255,.09);
  --text: #fff;
  --muted: #8e8e9f;
  --purple: #7c5cff;
  --blue: #4c82ff;
  --danger: #ff6378;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(124,92,255,.18),
      transparent 34%
    ),
    var(--bg);
  color: var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

button,
input,
select {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.app {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding:
    calc(7px + env(safe-area-inset-top))
    8px
    calc(7px + env(safe-area-inset-bottom));
}

/* =========================
   TOP
========================= */

.topbar {
  flex: 0 0 auto;
  min-height: 47px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 7px;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: rgba(17,17,29,.94);
}

.brand {
  display: flex;
  align-items: center;
  min-width: 0;
}

.brand img {
  display: block;
  width: 96px;
  max-width: 100%;
  height: auto;
}

.top-title {
  color: #c2b8ff;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: .55px;
  white-space: nowrap;
  text-transform: uppercase;
}

.save-top {
  justify-self: end;
  min-height: 34px;
  padding: 0 11px;
  border: 0;
  border-radius: 9px;
  color: white;
  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--blue)
    );
  font-size: 9px;
  font-weight: 900;
}

/* SECOND TOP ROW */

.projectbar {
  flex: 0 0 auto;
  min-height: 39px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 4px 7px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: rgba(17,17,29,.9);
}

.project-btn {
  min-width: 38px;
  min-height: 30px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: #d7d7e1;
  background: rgba(255,255,255,.035);
  font-size: 9px;
  font-weight: 850;
}

.project-btn.icon {
  width: 36px;
  min-width: 36px;
  padding: 0;
  font-size: 15px;
}

.project-btn.locked {
  color: #c7bdff;
  border-color: rgba(124,92,255,.32);
  background: rgba(124,92,255,.12);
}

.project-btn.reel {
  margin-left: auto;
  color: white;
  border-color: rgba(124,92,255,.25);
  background:
    linear-gradient(
      135deg,
      rgba(124,92,255,.25),
      rgba(76,130,255,.17)
    );
}

/* =========================
   CANVAS
========================= */

.workspace {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.canvas-area {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px 0;
}

.canvas-shell {
  position: relative;
  width: min(76vw, 43dvh, 355px);
  max-width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 13px;
  background: #fff;
  box-shadow:
    0 18px 45px rgba(0,0,0,.32);
  touch-action: none;
}

.canvas-container {
  width: 100% !important;
  height: 100% !important;
}

.canvas-container canvas {
  width: 100% !important;
  height: 100% !important;
}

.canvas-empty {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(0,0,0,.36);
  font-size: 10px;
  font-weight: 800;
}

/* =========================
   CONTROL AREA
========================= */

.controls {
  flex: 0 0 auto;
  border: 1px solid var(--border);
  border-radius: 15px;
  overflow: hidden;
  background: rgba(17,17,29,.97);
}

/* temporary full control */

.tool-workspace {
  min-height: 116px;
  padding: 9px;
}

.tool-head {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 10px;
}

.tool-head-title {
  flex: 1;
  font-size: 10px;
  font-weight: 900;
}

.done-btn,
.cancel-btn {
  min-height: 30px;
  padding: 0 10px;
  border-radius: 8px;
  font-size: 8px;
  font-weight: 900;
}

.done-btn {
  border: 0;
  color: #fff;
  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--blue)
    );
}

.cancel-btn {
  border: 1px solid var(--border);
  color: #bdbdca;
  background: rgba(255,255,255,.035);
}

.tool-content {
  min-height: 61px;
}

.tool-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.tool-row + .tool-row {
  margin-top: 9px;
}

.tool-label {
  min-width: 48px;
  color: var(--muted);
  font-size: 8px;
  font-weight: 800;
}

.tool-row input[type="range"] {
  flex: 1;
  min-width: 0;
  accent-color: var(--purple);
}

.tool-value {
  min-width: 42px;
  color: #dcdce7;
  font-size: 8px;
  font-weight: 900;
  text-align: right;
}

.tool-row input[type="color"] {
  width: 48px;
  height: 34px;
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel3);
}

.tool-row select,
.tool-row input[type="text"] {
  flex: 1;
  min-width: 0;
  height: 34px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
  color: white;
  background: var(--panel3);
  font-size: 9px;
}

/* context row */

.context-strip {
  height: 64px;
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 6px;
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
  overscroll-behavior-x: contain;
  touch-action: pan-x;
}

.context-strip::-webkit-scrollbar {
  display: none;
}

.control-item {
  flex: 0 0 55px;
  width: 55px;
  height: 53px;
  padding: 4px 2px;
  border: 0;
  border-radius: 9px;
  color: #a9a9b8;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.control-item:active,
.control-item.active {
  color: white;
  background: rgba(124,92,255,.13);
}

.control-icon {
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #e7e7ee;
  font-size: 18px;
  line-height: 1;
}

.control-name {
  width: 100%;
  overflow: hidden;
  font-size: 7px;
  font-weight: 750;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* bottom 4 */

.main-tools {
  height: 65px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  align-items: stretch;
}

.main-tool {
  position: relative;
  border: 0;
  border-right: 1px solid rgba(255,255,255,.055);
  color: #777789;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.main-tool:last-child {
  border-right: 0;
}

.main-tool.active {
  color: #fff;
  background:
    linear-gradient(
      180deg,
      rgba(124,92,255,.13),
      rgba(124,92,255,.035)
    );
}

.main-tool.active::before {
  content: "";
  position: absolute;
  top: 0;
  left: 28%;
  right: 28%;
  height: 2px;
  border-radius: 0 0 10px 10px;
  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--blue)
    );
}

.main-icon {
  font-size: 19px;
  line-height: 1;
}

.main-label {
  font-size: 8px;
  font-weight: 800;
}

/* POSITION */

.position-pad {
  width: 155px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3,43px);
  grid-template-rows: repeat(3,34px);
  justify-content: center;
  gap: 5px;
}

.move-btn {
  border: 1px solid var(--border);
  border-radius: 8px;
  color: white;
  background: rgba(255,255,255,.04);
  font-size: 15px;
}

.move-up {
  grid-column: 2;
  grid-row: 1;
}

.move-left {
  grid-column: 1;
  grid-row: 2;
}

.move-right {
  grid-column: 3;
  grid-row: 2;
}

.move-down {
  grid-column: 2;
  grid-row: 3;
}

/* SHAPES */

.shapes-scroll {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  gap: 8px;
  padding: 3px 1px 6px;
  scrollbar-width: none;
}

.shapes-scroll::-webkit-scrollbar {
  display: none;
}

.shape-btn {
  flex: 0 0 60px;
  height: 56px;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: #fff;
  background: rgba(255,255,255,.035);
  font-size: 22px;
}

/* =========================
   MODALS
========================= */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(7px);
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  width: min(100%, 470px);
  max-height: 82dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 17px;
  background: #11111d;
  box-shadow: 0 25px 70px rgba(0,0,0,.5);
}

.modal-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

.modal-title {
  flex: 1;
  font-size: 11px;
  font-weight: 900;
}

.modal-close {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: white;
  background: rgba(255,255,255,.035);
}

.modal-body {
  min-height: 0;
  overflow-y: auto;
  padding: 10px;
}

.projects-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 8px;
}

.project-card {
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: rgba(255,255,255,.025);
}

.project-preview {
  width: 100%;
  aspect-ratio: 1;
  display: block;
  object-fit: cover;
  border-radius: 8px;
  background: #0b0b12;
}

.project-name {
  margin: 6px 2px;
  color: #d7d7e0;
  font-size: 8px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.project-actions {
  display: grid;
  grid-template-columns: 1fr 32px;
  gap: 5px;
}

.project-open,
.project-delete {
  height: 31px;
  border-radius: 7px;
  font-size: 8px;
  font-weight: 850;
}

.project-open {
  border: 0;
  color: white;
  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--blue)
    );
}

.project-delete {
  border: 1px solid rgba(255,99,120,.2);
  color: #ff8191;
  background: rgba(255,99,120,.05);
}

.empty-projects {
  grid-column: 1/-1;
  padding: 25px 10px;
  color: var(--muted);
  text-align: center;
  font-size: 9px;
}

/* CONFIRM */

.confirm {
  width: min(100%, 360px);
  padding: 16px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 16px;
  background: #11111d;
}

.confirm h3 {
  margin-bottom: 7px;
  font-size: 13px;
}

.confirm p {
  color: var(--muted);
  font-size: 9px;
  line-height: 1.55;
}

.confirm-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 14px;
}

.confirm-actions button {
  height: 38px;
  border-radius: 9px;
  font-size: 9px;
  font-weight: 900;
}

.confirm-cancel {
  border: 1px solid var(--border);
  color: #cccbd6;
  background: rgba(255,255,255,.035);
}

.confirm-ok {
  border: 0;
  color: white;
  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--blue)
    );
}

/* CROP */

.crop-modal {
  width: min(100%, 480px);
}

.crop-area {
  width: min(78vw, 340px);
  aspect-ratio: 1;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #090910;
  touch-action: none;
}

.crop-area canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.crop-help {
  margin: 8px 0;
  color: var(--muted);
  font-size: 8px;
  text-align: center;
}

.crop-controls {
  padding: 0 4px;
}

.crop-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 10px;
}

.crop-actions button {
  height: 38px;
  border-radius: 9px;
  font-size: 9px;
  font-weight: 900;
}

/* TOAST */

.toast {
  position: fixed;
  z-index: 30000;
  left: 50%;
  bottom: calc(12px + env(safe-area-inset-bottom));
  max-width: calc(100vw - 24px);
  padding: 9px 13px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 999px;
  color: white;
  background: rgba(17,17,29,.97);
  font-size: 9px;
  font-weight: 800;
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%,10px);
  transition: .2s;
}

.toast.show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%,0);
}

.file-input {
  display: none;
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 900px) {
  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 16px 22px;
    gap: 10px;
  }

  .topbar {
    min-height: 58px;
    padding: 8px 13px;
  }

  .brand img {
    width: 128px;
  }

  .top-title {
    font-size: 11px;
  }

  .save-top {
    min-height: 38px;
    padding: 0 15px;
    font-size: 10px;
  }

  .projectbar {
    min-height: 45px;
  }

  .workspace {
    display: grid;
    grid-template-columns: minmax(0,1fr) 390px;
    gap: 14px;
  }

  .canvas-area {
    border: 1px solid var(--border);
    border-radius: 17px;
    background: rgba(17,17,29,.55);
  }

  .canvas-shell {
    width: min(62vh, 610px);
  }

  .controls {
    align-self: end;
  }

  .context-strip {
    height: 74px;
  }

  .main-tools {
    height: 74px;
  }

  .control-item {
    flex-basis: 61px;
    width: 61px;
    height: 60px;
  }

  .tool-workspace {
    min-height: 145px;
  }

  .projects-grid {
    grid-template-columns: repeat(3,minmax(0,1fr));
  }
}

@media (max-width: 370px) {
  .brand img {
    width: 83px;
  }

  .top-title {
    font-size: 8px;
  }

  .save-top {
    padding: 0 8px;
  }

  .project-btn {
    padding: 0 6px;
    font-size: 8px;
  }

  .canvas-shell {
    width: min(72vw, 40dvh, 320px);
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP ROW -->
  <header class="topbar">

    <a class="brand" href="index.html">
      <img
        src="viral1s-logo.webp"
        alt="Viral1s"
      >
    </a>

    <div class="top-title">
      Image Creator
    </div>

    <button
      id="saveBtn"
      class="save-top"
      type="button"
    >
      Save Image
    </button>

  </header>


  <!-- SECOND TOP ROW -->
  <div class="projectbar">

    <button
      id="undoBtn"
      class="project-btn icon"
      type="button"
      title="Undo"
    >
      ↶
    </button>

    <button
      id="redoBtn"
      class="project-btn icon"
      type="button"
      title="Redo"
    >
      ↷
    </button>

    <button
      id="newBtn"
      class="project-btn"
      type="button"
    >
      New
    </button>

    <button
      id="lockBtn"
      class="project-btn icon"
      type="button"
      title="Lock selected element"
    >
      🔓
    </button>

    <button
      id="useReelBtn"
      class="project-btn reel"
      type="button"
    >
      Use in Reel
    </button>

  </div>


  <main class="workspace">

    <!-- CANVAS -->
    <section class="canvas-area">

      <div
        id="canvasShell"
        class="canvas-shell"
      >

        <div
          id="canvasEmpty"
          class="canvas-empty"
        >
          Create your image
        </div>

        <canvas
          id="mainCanvas"
          width="1080"
          height="1080"
        ></canvas>

      </div>

    </section>


    <!-- CONTROLS -->
    <section class="controls">

      <!-- SPECIAL TOOL WORKSPACE -->
      <div
        id="toolWorkspace"
        class="tool-workspace hidden"
      >

        <div class="tool-head">

          <button
            id="toolCancel"
            class="cancel-btn"
            type="button"
          >
            Cancel
          </button>

          <div
            id="toolTitle"
            class="tool-head-title"
          >
            Tool
          </div>

          <button
            id="toolDone"
            class="done-btn"
            type="button"
          >
            Done
          </button>

        </div>

        <div
          id="toolContent"
          class="tool-content"
        ></div>

      </div>


      <!-- CONTEXT ROW -->
      <div
        id="contextStrip"
        class="context-strip"
      ></div>


      <!-- BOTTOM 4 ICONS -->
      <div
        id="mainTools"
        class="main-tools"
      >

        <button
          class="main-tool"
          data-main="projects"
          type="button"
        >
          <span class="main-icon">▣</span>
          <span class="main-label">Projects</span>
        </button>

        <button
          class="main-tool"
          data-main="text"
          type="button"
        >
          <span class="main-icon">T</span>
          <span class="main-label">Text</span>
        </button>

        <button
          class="main-tool"
          data-main="image"
          type="button"
        >
          <span class="main-icon">▧</span>
          <span class="main-label">Image</span>
        </button>

        <button
          class="main-tool active"
          data-main="background"
          type="button"
        >
          <span class="main-icon">◩</span>
          <span class="main-label">Background</span>
        </button>

      </div>

    </section>

  </main>

</div>


<input
  id="imageInput"
  class="file-input"
  type="file"
  accept="image/*"
>

<input
  id="backgroundInput"
  class="file-input"
  type="file"
  accept="image/*"
>

<input
  id="replaceInput"
  class="file-input"
  type="file"
  accept="image/*"
>


<!-- PROJECTS MODAL -->
<div
  id="projectsModal"
  class="modal-backdrop"
>

  <div class="modal">

    <div class="modal-head">
      <div class="modal-title">
        My Projects
      </div>

      <button
        id="closeProjects"
        class="modal-close"
        type="button"
      >
        ×
      </button>
    </div>

    <div class="modal-body">
      <div
        id="projectsGrid"

/* =========================================
   HELPERS
========================================= */

function showToast(message) {

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      () => {
        toast.classList.remove(
          "show"
        );
      },
      1900
    );
}


function activeObject() {
  return canvas.getActiveObject();
}


function isText(object) {

  return Boolean(
    object &&
    (
      object.type === "i-text" ||
      object.type === "textbox" ||
      object.type === "text"
    )
  );
}


function isImage(object) {

  return Boolean(
    object &&
    object.type === "image" &&
    !object.v1Background
  );
}


function isBackground(object) {

  return Boolean(
    object &&
    object.v1Background
  );
}


function updateEmpty() {

  canvasEmpty.classList.toggle(
    "hidden",
    canvas.getObjects().length > 0
  );
}


function serialize() {

  return JSON.stringify(
    canvas.toJSON([
      "v1Background",
      "v1Locked",
      "v1Shape"
      "v1FontKey"
    ])
  );
}


function markChanged(
  addHistory = true
) {

  if (restoring) {
    return;
  }

  dirty = true;

  if (addHistory) {
    pushHistory();
  }

  scheduleAutosave();
}


function ensureBackgroundBack() {

  const background =
    canvas
      .getObjects()
      .find(isBackground);

  if (background) {
    canvas.sendToBack(
      background
    );
  }
}


function setObjectLocked(
  object,
  locked
) {

  if (!object) {
    return;
  }

  object.v1Locked =
    Boolean(locked);

  object.set({
    lockMovementX: locked,
    lockMovementY: locked,
    lockScalingX: locked,
    lockScalingY: locked,
    lockRotation: locked,
    hasControls: !locked
  });

  object.setCoords();

  canvas.requestRenderAll();

  updateLockButton();
}


function normalizeObjects() {

  canvas
    .getObjects()
    .forEach(
      object => {

        setObjectLocked(
          object,
          Boolean(
            object.v1Locked
          )
        );

      }
    );

  ensureBackgroundBack();
}


function updateLockButton() {

  const object =
    activeObject();

  if (!object) {

    lockBtn.textContent =
      "🔓";

    lockBtn.classList.remove(
      "locked"
    );

    return;
  }

  const locked =
    Boolean(
      object.v1Locked
    );

  lockBtn.textContent =
    locked
      ? "🔒"
      : "🔓";

  lockBtn.classList.toggle(
    "locked",
    locked
  );
}


/* =========================================
   HISTORY
========================================= */

function pushHistory() {

  if (restoring) {
    return;
  }

  const snapshot =
    serialize();

  if (
    history[historyIndex] ===
    snapshot
  ) {
    return;
  }

  history =
    history.slice(
      0,
      historyIndex + 1
    );

  history.push(snapshot);

  if (history.length > 50) {
    history.shift();
  }

  historyIndex =
    history.length - 1;

  updateHistoryButtons();
}


function resetHistory() {

  history = [
    serialize()
  ];

  historyIndex = 0;

  updateHistoryButtons();
}


function updateHistoryButtons() {

  undoBtn.disabled =
    historyIndex <= 0;

  redoBtn.disabled =
    historyIndex >=
    history.length - 1;

  undoBtn.style.opacity =
    undoBtn.disabled
      ? ".35"
      : "1";

  redoBtn.style.opacity =
    redoBtn.disabled
      ? ".35"
      : "1";
}


function restoreHistory(
  index
) {

  const snapshot =
    history[index];

  if (!snapshot) {
    return;
  }

  restoring = true;

  canvas.loadFromJSON(
    snapshot,
    () => {

      normalizeObjects();

      canvas.renderAll();

      restoring = false;

      dirty = true;

      updateEmpty();

      updateLockButton();

      renderContext();

      scheduleAutosave();

    }
  );
}


undoBtn.addEventListener(
  "click",
  () => {

    if (historyIndex <= 0) {
      return;
    }

    historyIndex--;

    restoreHistory(
      historyIndex
    );

    updateHistoryButtons();
  }
);


redoBtn.addEventListener(
  "click",
  () => {

    if (
      historyIndex >=
      history.length - 1
    ) {
      return;
    }

    historyIndex++;

    restoreHistory(
      historyIndex
    );

    updateHistoryButtons();
  }
);


/* =========================================
   FABRIC EVENTS
========================================= */

canvas.on(

  () => {
    markChanged();

  }

canvas.on(

      "⧉",
      "Copy",

      "⇧",

/* =========================================
   TOOL WORKSPACE
========================================= */

function openToolWorkspace(
  title,
  html,
  doneAction = null,
  cancelAction = null
) {

  toolBeforeState =
    serialize();

  toolDoneAction =
    doneAction;

  toolCancelAction =
    cancelAction;

  toolTitle.textContent =
    title;

  toolContent.innerHTML =
    html;

  contextStrip.classList.add(
    "hidden"
  );

  mainTools.classList.add(
    "hidden"
  );

  toolWorkspace.classList.remove(
    "hidden"
  );
}


function closeToolWorkspace(
  keepChanges = true
) {

  if (
    toolWorkspace.classList.contains(
      "hidden"
    )
  ) {
    return;
  }

  if (!keepChanges) {

    if (toolCancelAction) {

      toolCancelAction();

    } else if (
      toolBeforeState
    ) {

      restoring = true;

      canvas.loadFromJSON(
        toolBeforeState,
        () => {

          normalizeObjects();

          canvas.renderAll();

          restoring = false;

          updateEmpty();

          renderContext();
        }
      );
    }
  }

  toolWorkspace.classList.add(
    "hidden"
  );

  contextStrip.classList.remove(
    "hidden"
  );

  mainTools.classList.remove(
    "hidden"
  );

  toolContent.innerHTML = "";

  toolDoneAction = null;
  toolCancelAction = null;
  toolBeforeState = null;

  renderContext();
}

/* =========================================
   IMAGE
========================================= */

function fileToDataURL(file) {

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(file);
    }
  );
}


function fabricImageFromURL(url) {

  return new Promise(
    (resolve,reject) => {

      fabric.Image.fromURL(
        url,
        image => {

          if (!image) {

            reject(
              new Error(
                "Image failed"
              )
            );

            return;
          }

          resolve(image);
        }
      );
    }
  );
}


async function addImageFile(file) {

  try {

    const url =
      await fileToDataURL(file);

    const image =
      await fabricImageFromURL(
        url
      );

    const max =
      SIZE * .58;

    const scale =
      Math.min(
        max / image.width,
        max / image.height,
        1
      );

    image.set({
      left: SIZE / 2,
      top: SIZE / 2,
      originX: "center",
      originY: "center",
      scaleX: scale,
      scaleY: scale,
      v1Locked: false
    });

    canvas.add(image);

    ensureBackgroundBack();

    canvas.setActiveObject(
      image
    );

    canvas.requestRenderAll();

    currentMainTool =
      "image";

    activateBottomTool(
      "image"
    );

    markChanged();

    renderContext();

  } catch (error) {

    console.error(error);

    showToast(
      "Could not add image."
    );
  }
}


imageInput.addEventListener(
  "change",
  async () => {

    const file =
      imageInput.files[0];

    if (!file) {
      return;
    }

    await addImageFile(file);

    imageInput.value = "";
  }
);


replaceInput.addEventListener(
  "change",
  async () => {

    const file =
      replaceInput.files[0];

    if (
      !file ||
      !replaceTarget
    ) {
      return;
    }

    try {

      const url =
        await fileToDataURL(file);

      const newImage =
        await fabricImageFromURL(
          url
        );

      const old =
        replaceTarget;

      const oldWidth =
        old.getScaledWidth();

      const oldHeight =
        old.getScaledHeight();

      const targetBox =
        Math.max(
          oldWidth,
          oldHeight
        );

      const scale =
        Math.min(
          targetBox / newImage.width,
          targetBox / newImage.height
        );

      newImage.set({
        left: old.left,
        top: old.top,
        originX: old.originX,
        originY: old.originY,
        angle: old.angle,
        opacity: old.opacity,
        scaleX: scale,
        scaleY: scale,
        flipX: old.flipX,
        flipY: old.flipY,
        shadow: old.shadow,
        stroke: old.stroke,
        strokeWidth:
          old.strokeWidth,
        v1Locked:
          old.v1Locked
      });

      const index =
        canvas
          .getObjects()
          .indexOf(old);

      canvas.remove(old);

      canvas.insertAt(
        newImage,
        Math.max(index,0),
        false
      );

      setObjectLocked(
        newImage,
        Boolean(
          newImage.v1Locked
        )
      );

      ensureBackgroundBack();

      canvas.setActiveObject(
        newImage
      );

      canvas.requestRenderAll();

      replaceTarget =
        newImage;

      markChanged();

      renderContext();

    } catch (error) {

      console.error(error);

      showToast(
        "Could not replace image."
      );
    }

    replaceInput.value = "";
  }
);

function addShape(
  type,
  color
) {

  let object = null;

  if (type === "rect") {

    object =
      new fabric.Rect({
        width: 360,
        height: 360,
        rx: 18,
        ry: 18,
        fill: color
      });
  }

  if (type === "circle") {

    object =
      new fabric.Circle({
        radius: 180,
        fill: color
      });
  }

  if (type === "triangle") {

    object =
      new fabric.Triangle({
        width: 380,
        height: 340,
        fill: color
      });
  }

  if (type === "diamond") {

    object =
      new fabric.Rect({
        width: 280,
        height: 280,
        angle: 45,
        fill: color
      });
  }

  if (type === "line") {

    object =
      new fabric.Rect({
        width: 500,
        height: 28,
        rx: 14,
        ry: 14,
        fill: color
      });
  }

  if (!object) {
    return;
  }

  object.set({
    left: SIZE / 2,
    top: SIZE / 2,
    originX: "center",
    originY: "center",
    v1Shape: true,
    v1Locked: false
  });

  canvas.add(object);

  ensureBackgroundBack();

  canvas.setActiveObject(
    object
  );

  canvas.requestRenderAll();
}

function openPositionTool() {

  const object =
    activeObject();

  if (!object) {
    return;

  openToolWorkspace(
    "Position",
    `
      <div class="tool-row">
        <span class="tool-label">
          Step
        </span>

        <input
          id="moveStep"
          type="range"
          min="1"
          max="30"
          value="${
            localStorage.getItem(
              "viral1s_move_step"
            ) || 8
          }"
        >

        <span
          id="moveValue"
          class="tool-value"
        ></span>
      </div>

      <div class="position-pad">

        <button
          class="move-btn move-up"
          data-direction="up"
          type="button"
        >
          ↑
        </button>

        <button
          class="move-btn move-left"
          data-direction="left"
          type="button"
        >
          ←
        </button>

        <button
          class="move-btn move-right"
          data-direction="right"
          type="button"
        >
          →
        </button>

        <button
          class="move-btn move-down"
          data-direction="down"
          type="button"
        >
          ↓
        </button>

      </div>
    `
  );

  const step =
    document.getElementById(
      "moveStep"
    );

  const value =
    document.getElementById(
      "moveValue"
    );

  function updateValue() {

    value.textContent =
      `${step.value}px`;

    localStorage.setItem(
      "viral1s_move_step",
      step.value
    );
  }

  updateValue();

  step.addEventListener(
    "input",
    updateValue
  );

  document
    .querySelectorAll(
      "[data-direction]"
    )
    .forEach(
      button => {

        let interval = null;
        let timeout = null;

        const move = () => {

          if (object.v1Locked) {
            return;
          }

          const amount =
            Number(step.value);

          if (
            button.dataset.direction ===
            "left"
          ) {
            object.left -= amount;
          }

          if (
            button.dataset.direction ===
            "right"
          ) {
            object.left += amount;
          }

          if (
            button.dataset.direction ===
            "up"
          ) {
            object.top -= amount;
          }

          if (
            button.dataset.direction ===
            "down"
          ) {
            object.top += amount;
          }

          object.setCoords();

          canvas.requestRenderAll();
        };

        button.addEventListener(
          "pointerdown",
          event => {

            event.preventDefault();

            move();

            timeout =
              setTimeout(
                () => {

                  interval =
                    setInterval(
                      move,
                      65
                    );
                },
                300
              );
          }
        );

        const stop = () => {
          clearTimeout(timeout);
          clearInterval(interval);
        };

        button.addEventListener(
          "pointerup",
          stop
        );

        button.addEventListener(
          "pointercancel",
          stop
        );

        button.addEventListener(
          "pointerleave",
          stop
        );
      }
    );
}

function normalizeColor(
  value,
  fallback
) {

  if (
    typeof value === "string" &&
    /^#[0-9a-f]{6}$/i.test(
      value
    )
  ) {
    return value;
  }

  return fallback;
}
function fixArabicText(object) {

  if (!isText(object)) {
    return;
  }

  const text =
    object.text || "";

  const hasArabic =
    /[\u0600-\u06FF]/.test(text);

  if (hasArabic) {

    object.set({
      direction: "rtl",
      textAlign: "right"
    });

  } else {

    object.set({
      direction: "ltr"
    });
  }

  object.setCoords();
}

/* =========================================
   BACKGROUND CROP
========================================= */

const cropCtx =
  cropCanvas.getContext("2d");

let cropImage = null;
let cropBaseScale = 1;
let cropScale = 1;
let cropX = 0;
let cropY = 0;
let cropDragging = false;
let cropLastX = 0;
let cropLastY = 0;


backgroundInput.addEventListener(
  "change",
  async () => {

    const file =
      backgroundInput.files[0];

    if (!file) {
      return;
    }

    try {

      const url =
        await fileToDataURL(file);

      const image =
        new Image();

      image.onload =
        () => {

          cropImage =
            image;

          setupCrop();

          cropModal.classList.add(
            "show"
          );
        };

      image.src = url;

    } catch (error) {

      console.error(error);

      showToast(
        "Could not open background."
      );
    }

    backgroundInput.value = "";
  }
);


function setupCrop() {

  if (!cropImage) {
    return;
  }

  const box =
    cropCanvas.width;

  cropBaseScale =
    Math.max(
      box / cropImage.width,
      box / cropImage.height
    );

  cropScale =
    cropBaseScale;

  cropZoom.value = 100;

  cropZoomValue.textContent =
    "100%";

  const width =
    cropImage.width *
    cropScale;

  const height =
    cropImage.height *
    cropScale;

  cropX =
    (box - width) / 2;

  cropY =
    (box - height) / 2;

  drawCrop();
}


function drawCrop() {

  const box =
    cropCanvas.width;

  cropCtx.clearRect(
    0,
    0,
    box,
    box
  );

  cropCtx.fillStyle =
    "#090910";

  cropCtx.fillRect(
    0,
    0,
    box,
    box
  );

  if (!cropImage) {
    return;
  }

  cropCtx.drawImage(
    cropImage,
    cropX,
    cropY,
    cropImage.width *
      cropScale,
    cropImage.height *
      cropScale
  );
}


function clampCrop() {

  if (!cropImage) {
    return;
  }

  const box =
    cropCanvas.width;

  const width =
    cropImage.width *
    cropScale;

  const height =
    cropImage.height *
    cropScale;

  if (width >= box) {

    cropX =
      Math.min(
        0,
        Math.max(
          box - width,
          cropX
        )
      );

  } else {

    cropX =
      (box - width) / 2;
  }

  if (height >= box) {

    cropY =
      Math.min(
        0,
        Math.max(
          box - height,
          cropY
        )
      );

  } else {

    cropY =
      (box - height) / 2;
  }
}


cropZoom.addEventListener(
  "input",
  () => {

    if (!cropImage) {
      return;
    }

    const box =
      cropCanvas.width;

    const oldWidth =
      cropImage.width *
      cropScale;

    const oldHeight =
      cropImage.height *
      cropScale;

    const centerX =
      (box / 2 - cropX) /
      oldWidth;

    const centerY =
      (box / 2 - cropY) /
      oldHeight;

    cropScale =
      cropBaseScale *
      (
        Number(
          cropZoom.value
        ) / 100
      );

    const newWidth =
      cropImage.width *
      cropScale;

    const newHeight =
      cropImage.height *
      cropScale;

    cropX =
      box / 2 -
      centerX *
      newWidth;

    cropY =
      box / 2 -
      centerY *
      newHeight;

    cropZoomValue.textContent =
      `${cropZoom.value}%`;

    clampCrop();

    drawCrop();
  }
);


function cropPointerPosition(
  event
) {

  const rect =
    cropCanvas.getBoundingClientRect();

  return {
    x:
      (
        event.clientX -
        rect.left
      ) *
      cropCanvas.width /
      rect.width,

    y:
      (
        event.clientY -
        rect.top
      ) *
      cropCanvas.height /
      rect.height
  };
}


cropCanvas.addEventListener(
  "pointerdown",
  event => {

    cropDragging = true;

    cropCanvas.setPointerCapture(
      event.pointerId
    );

    const point =
      cropPointerPosition(
        event
      );

    cropLastX =
      point.x;

    cropLastY =
      point.y;
  }
);


cropCanvas.addEventListener(
  "pointermove",
  event => {

    if (!cropDragging) {
      return;
    }

    const point =
      cropPointerPosition(
        event
      );

    cropX +=
      point.x -
      cropLastX;

    cropY +=
      point.y -
      cropLastY;

    cropLastX =
      point.x;

    cropLastY =
      point.y;

    clampCrop();

    drawCrop();
  }
);


function stopCropDrag() {
  cropDragging = false;
}


cropCanvas.addEventListener(
  "pointerup",
  stopCropDrag
);

cropCanvas.addEventListener(
  "pointercancel",
  stopCropDrag
);


cropCancel.addEventListener(
  "click",
  () => {

    cropModal.classList.remove(
      "show"
    );

    cropImage = null;
  }
);


cropDone.addEventListener(
  "click",
  async () => {

    if (!cropImage) {
      return;
    }

    const exportCanvas =
      document.createElement(
        "canvas"
      );

    exportCanvas.width =
      SIZE;

    exportCanvas.height =
      SIZE;

    const ctx =
      exportCanvas.getContext(
        "2d"
      );

    const ratio =
      SIZE /
      cropCanvas.width;

    ctx.fillStyle =
      "#ffffff";

    ctx.fillRect(
      0,
      0,
      SIZE,
      SIZE
    );

    ctx.drawImage(
      cropImage,
      cropX * ratio,
      cropY * ratio,
      cropImage.width *
        cropScale *
        ratio,
      cropImage.height *
        cropScale *
        ratio
    );

    const data =
      exportCanvas.toDataURL(
        "image/jpeg",
        .95
      );

    try {

      const image =
        await fabricImageFromURL(
          data
        );

      const oldBackground =
        canvas
          .getObjects()
          .find(isBackground);

      if (oldBackground) {
        canvas.remove(
          oldBackground
        );
      }

      image.set({
        left: 0,
        top: 0,
        originX: "left",
        originY: "top",
        scaleX:
          SIZE /
          image.width,
        scaleY:
          SIZE /
          image.height,
        selectable: true,
        v1Background: true,
        v1Locked: false
      });

      canvas.add(image);

      canvas.sendToBack(image);

      canvas.setActiveObject(
        image
      );

      canvas.requestRenderAll();

      cropModal.classList.remove(
        "show"
      );

      cropImage = null;

      markChanged();

      showToast(
        "Background added"
      );

    } catch (error) {

      console.error(error);

      showToast(
        "Could not add background."
      );
    }
  }
);


/* =========================================
   LOCK
========================================= */

lockBtn.addEventListener(
  "click",
  () => {

    const object =
      activeObject();

    if (!object) {

      showToast(
        "Select an element first"
      );

      return;
    }

    setObjectLocked(
      object,
      !object.v1Locked
    );

    markChanged();

    showToast(
      object.v1Locked
        ? "Element locked"
        : "Element unlocked"
    );
  }
);


/* =========================================
   DEFAULT
========================================= */

function createDefaultProject() {

  const action = () => {

    resetProject(false);

    canvas.backgroundColor =
      "#ffffff";

    const text =
      new fabric.IText(
        "Your text",
        {
          left: SIZE / 2,
          top: SIZE / 2,
          originX: "center",
          originY: "center",
          fontSize: 86,
          fontWeight: "bold",
          fontFamily: "Arial",
          fill: "#111111",
          textAlign: "center",
          v1Locked: false
        }
      );

    canvas.add(text);

    canvas.setActiveObject(
      text
    );

    canvas.requestRenderAll();

    dirty = true;

    resetHistory();

    scheduleAutosave();

    currentMainTool =
      "text";

    activateBottomTool(
      "text"
    );

    renderContext();
  };

  if (hasCurrentWork()) {

    askConfirm(
      "Start Default?",
      "Your current unsaved changes will be replaced.",
      action
    );

  } else {

    action();
  }
}


/* =========================================
   NEW
========================================= */

function hasCurrentWork() {

  return (
    dirty ||
    canvas.getObjects().length > 0 ||
    currentProjectId !== null
  );
}


function resetProject(
  notify = true
) {

  restoring = true;

  canvas.clear();

  canvas.backgroundColor =
    "#ffffff";

  canvas.renderAll();

  restoring = false;

  currentProjectId = null;

  dirty = false;

  saveBtn.textContent =
    "Save Image";

  currentMainTool =
    "background";

  activateBottomTool(
    "background"
  );

  resetHistory();

  updateEmpty();

  updateLockButton();

  renderContext();

  clearWorkingSession();

  if (notify) {

    showToast(
      "New image started"
    );
  }
}


newBtn.addEventListener(
  "click",
  () => {

    askConfirm(
      "Start a new image?",
      "Your current work will be cleared and you will start from zero.",
      () => resetProject()
    );
  }
);


/* =========================================
   CONFIRM
========================================= */

function askConfirm(
  title,
  message,
  action
) {

  confirmTitle.textContent =
    title;

  confirmText.textContent =
    message;

  confirmAction =
    action;

  confirmModal.classList.add(
    "show"
  );
}


function closeConfirm() {

  confirmModal.classList.remove(
    "show"
  );

  confirmAction = null;
}


confirmCancel.addEventListener(
  "click",
  closeConfirm
);


confirmOk.addEventListener(
  "click",
  () => {

    const action =
      confirmAction;

    closeConfirm();

    if (action) {
      action();
    }
  }
);


/* =========================================
   DATABASE
========================================= */

function openDatabase() {

  return new Promise(
    (resolve,reject) => {

      const request =
        indexedDB.open(
          "viral1s_image_creator",
          3
        );

      request.onupgradeneeded =
        () => {

          const database =
            request.result;

          if (
            !database
              .objectStoreNames
              .contains(
                "projects"
              )
          ) {

            database.createObjectStore(
              "projects",
              {
                keyPath: "id"
              }
            );
          }

          if (
            !database
              .objectStoreNames
              .contains(
                "working"
              )
          ) {

            database.createObjectStore(
              "working",
              {
                keyPath: "id"
              }
            );
          }

          if (
            !database
              .objectStoreNames
              .contains(
                "reel_transfer"
              )
          ) {

            database.createObjectStore(
              "reel_transfer",
              {
                keyPath: "id"
              }
            );
          }
        };

      request.onsuccess =
        () => resolve(
          request.result
        );

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


function dbPut(
  storeName,
  value
) {

  return new Promise(
    (resolve,reject) => {

      const tx =
        db.transaction(
          storeName,
          "readwrite"
        );

      const store =
        tx.objectStore(
          storeName
        );

      const request =
        store.put(value);

      request.onsuccess =
        () => resolve();

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


function dbGet(
  storeName,
  key
) {

  return new Promise(
    (resolve,reject) => {

      const tx =
        db.transaction(
          storeName,
          "readonly"
        );

      const store =
        tx.objectStore(
          storeName
        );

      const request =
        store.get(key);

      request.onsuccess =
        () => resolve(
          request.result
        );

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


function dbGetAll(
  storeName
) {

  return new Promise(
    (resolve,reject) => {

      const tx =
        db.transaction(
          storeName,
          "readonly"
        );

      const store =
        tx.objectStore(
          storeName
        );

      const request =
        store.getAll();

      request.onsuccess =
        () => resolve(
          request.result || []
        );

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


function dbDelete(
  storeName,
  key
) {

  return new Promise(
    (resolve,reject) => {

      const tx =
        db.transaction(
          storeName,
          "readwrite"
        );

      const store =
        tx.objectStore(
          storeName
        );

      const request =
        store.delete(key);

      request.onsuccess =
        () => resolve();

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


/* =========================================
   AUTO SAVE WORKING SESSION
========================================= */

function scheduleAutosave() {

  if (!db) {
    return;
  }

  clearTimeout(
    autosaveTimer
  );

  autosaveTimer =
    setTimeout(
      saveWorkingSession,
      350
    );
}


async function saveWorkingSession() {

  if (!db) {
    return;
  }

  try {

    await dbPut(
      "working",
      {
        id: "current",
        projectId:
          currentProjectId,
        canvasJson:
          serialize(),
        dirty,
        mainTool:
          currentMainTool,
        updatedAt:
          Date.now()
      }
    );

  } catch (error) {

    console.error(
      "Autosave:",
      error
    );
  }
}


async function clearWorkingSession() {

  if (!db) {
    return;
  }

  try {

    await dbDelete(
      "working",
      "current"
    );

  } catch {}
}


async function restoreWorkingSession() {

  if (!db) {
    return false;
  }

  const session =
    await dbGet(
      "working",
      "current"
    );

  if (
    !session ||
    !session.canvasJson
  ) {
    return false;
  }

  return new Promise(
    resolve => {

      restoring = true;

      canvas.loadFromJSON(
        session.canvasJson,
        () => {

          normalizeObjects();

          canvas.renderAll();

          restoring = false;

          currentProjectId =
            session.projectId ||
            null;

          dirty =
            Boolean(
              session.dirty
            );

          currentMainTool =
            session.mainTool ||
            "background";

          saveBtn.textContent =
            currentProjectId
              ? "Update Image"
              : "Save Image";

          activateBottomTool(
            currentMainTool
          );

          updateEmpty();

          updateLockButton();

          resetHistory();

          renderContext();

          resolve(true);
        }
      );
    }
  );
}


/* =========================================
   SAVE PROJECT
========================================= */

function makeId() {

  if (
    crypto &&
    crypto.randomUUID
  ) {
    return crypto.randomUUID();
  }

  return (
    "v1_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2)
  );
}


async function saveProject() {

  if (!db) {

    showToast(
      "Storage is not ready"
    );

    return;
  }

  const updating =
    Boolean(
      currentProjectId
    );

  saveBtn.disabled = true;

  saveBtn.textContent =
    updating
      ? "Updating..."
      : "Saving...";

  try {

    canvas.discardActiveObject();

    canvas.requestRenderAll();

    const id =
      currentProjectId ||
      makeId();

    let old = null;

    if (currentProjectId) {

      old =
        await dbGet(
          "projects",
          currentProjectId
        );
    }

    const preview =
      canvas.toDataURL({
        format: "jpeg",
        quality: .78,
        multiplier: .28
      });

    await dbPut(
      "projects",
      {
        id,
        name:
          old?.name ||
          `Image ${new Date().toLocaleDateString()}`,
        createdAt:
          old?.createdAt ||
          Date.now(),
        updatedAt:
          Date.now(),
        canvasJson:
          serialize(),
        preview
      }
    );

    currentProjectId = id;

    dirty = false;

    saveBtn.textContent =
      "Update Image";

    await saveWorkingSession();

    showToast(
      updating
        ? "Image updated ✓"
        : "Image saved ✓"
    );

  } catch (error) {

    console.error(error);

    showToast(
      "Could not save image"
    );

    saveBtn.textContent =
      currentProjectId
        ? "Update Image"
        : "Save Image";
  }

  saveBtn.disabled = false;
}


saveBtn.addEventListener(
  "click",
  saveProject
);


/* =========================================
   PROJECTS
========================================= */

async function openProjects() {

  await renderProjects();

  projectsModal.classList.add(
    "show"
  );
}


function closeProjectsModal() {

  projectsModal.classList.remove(
    "show"
  );
}


closeProjects.addEventListener(
  "click",
  closeProjectsModal
);


async function renderProjects() {

  projectsGrid.innerHTML = "";

  if (!db) {
    return;
  }

  const projects =
    await dbGetAll(
      "projects"
    );

  projects.sort(
    (a,b) =>
      b.updatedAt -
      a.updatedAt
  );

  if (!projects.length) {

    projectsGrid.innerHTML =
      `
        <div class="empty-projects">
          No saved projects yet.
        </div>
      `;

    return;
  }

  projects.forEach(
    project => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "project-card";

      const image =
        document.createElement(
          "img"
        );

      image.className =
        "project-preview";

      image.src =
        project.preview;

      image.alt =
        "Saved project";

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "project-name";

      name.textContent =
        project.name;

      const actions =
        document.createElement(
          "div"
        );

      actions.className =
        "project-actions";

      const open =
        document.createElement(
          "button"
        );

      open.className =
        "project-open";

      open.textContent =
        "Open";

      open.addEventListener(
        "click",
        () => {

          askConfirm(
            "Open this project?",
            "Your current work will be replaced by the selected saved project.",
            () => loadProject(
              project.id
            )
          );
        }
      );

      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "project-delete";

      remove.textContent =
        "×";

      remove.addEventListener(
        "click",
        () => {

          askConfirm(
            "Delete project?",
            "This saved project will be permanently removed from this device.",
            async () => {

              await dbDelete(
                "projects",
                project.id
              );

              if (
                currentProjectId ===
                project.id
              ) {
                currentProjectId =
                  null;

                saveBtn.textContent =
                  "Save Image";
              }

              await renderProjects();

              showToast(
                "Project deleted"
              );
            }
          );
        }
      );

      actions.append(
        open,
        remove
      );

      card.append(
        image,
        name,
        actions
      );

      projectsGrid.appendChild(
        card
      );
    }
  );
}


async function loadProject(id) {

  const project =
    await dbGet(
      "projects",
      id
    );

  if (!project) {
    return;
  }

  closeProjectsModal();

  restoring = true;

  canvas.loadFromJSON(
    project.canvasJson,
    () => {

      normalizeObjects();

      canvas.renderAll();

      restoring = false;

      currentProjectId =
        project.id;

      dirty = false;

      saveBtn.textContent =
        "Update Image";

      updateEmpty();

      updateLockButton();

      resetHistory();

      renderContext();

      saveWorkingSession();

      showToast(
        "Project opened"
      );
    }
  );
}


/* =========================================
   USE IN REEL
========================================= */

useReelBtn.addEventListener(
  "click",
  () => {

    askConfirm(
      "Use this image in your reel?",
      "A 1080×1080 copy will be sent to the Viral1s Reel Editor. Your editable project will stay here.",
      sendToReel
    );
  }
);


async function sendToReel() {

  if (!db) {

    showToast(
      "Storage is not ready"
    );

    return;
  }

  try {

    canvas.discardActiveObject();

    canvas.requestRenderAll();

    await saveWorkingSession();

    const dataUrl =
      canvas.toDataURL({
        format: "png",
        multiplier: 1
      });

    const response =
      await fetch(dataUrl);

    const blob =
      await response.blob();

    await dbPut(
      "reel_transfer",
      {
        id: "current",
        blob,
        createdAt:
          Date.now()
      }
    );

    window.location.href =
      "editor.html?from=image-creator";

  } catch (error) {

    console.error(error);

    showToast(
      "Could not send image"
    );
  }
}


/* =========================================
   BOTTOM ACTIVE
========================================= */

function activateBottomTool(name) {

  document
    .querySelectorAll(
      ".main-tool"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.main ===
          name
        );
      }
    );
}


/* =========================================
   INIT
========================================= */

async function init() {

  try {

    db =
      await openDatabase();

    const restored =
      await restoreWorkingSession();

    if (!restored) {

      canvas.backgroundColor =
        "#ffffff";

      canvas.renderAll();

      resetHistory();

      updateEmpty();

      renderContext();
    }

  } catch (error) {

    console.error(error);

    showToast(
      "Local storage unavailable"
    );

    resetHistory();

    renderContext();
  }

  resizeCanvasDisplay();
}


init();
</script>
