<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Viral1s Image Creator</title>

  <link
    rel="icon"
    type="image/png"
    href="viral1s-icon.png"
  >

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070711;
      --panel: #11111d;
      --panel-2: #151523;
      --panel-3: #0f0f19;
      --border: rgba(255,255,255,.08);
      --border-strong: rgba(255,255,255,.14);
      --text: #fff;
      --muted: #9898aa;
      --purple: #7c5cff;
      --blue: #4387ff;
      --danger: #ff6074;
      --green: #28d98b;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% -8%,
          rgba(124,92,255,.2),
          transparent 32%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding:
        calc(10px + env(safe-area-inset-top))
        10px
        calc(10px + env(safe-area-inset-bottom));
      gap: 9px;
    }

    .topbar {
      flex: 0 0 auto;
      min-height: 52px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(17,17,29,.92);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 36px rgba(0,0,0,.24);
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .topbar-right {
      justify-content: flex-end;
    }

    .logo-link {
      display: inline-flex;
      align-items: center;
    }

    .logo-link img {
      width: 105px;
      height: auto;
      display: block;
    }

    .page-name {
      min-width: 0;
      text-align: center;
      color: #b9adff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .icon-btn,
    .top-btn {
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #ddddea;
      background: rgba(255,255,255,.035);
      cursor: pointer;
      font-size: 11px;
      font-weight: 850;
    }

    .icon-btn {
      width: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .top-btn {
      padding: 0 10px;
    }

    .top-btn.primary {
      border-color: rgba(124,92,255,.25);
      color: #fff;
      background:
        linear-gradient(
          135deg,
          rgba(124,92,255,.26),
          rgba(67,135,255,.18)
        );
    }

    .main-layout {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0,1fr);
      gap: 9px;
    }

    .canvas-panel {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 18px;
      background:
        linear-gradient(
          160deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.012)
        ),
        var(--panel);
      padding: 10px;
      box-shadow: 0 18px 48px rgba(0,0,0,.23);
    }

    .canvas-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .canvas-title {
      font-size: 11px;
      font-weight: 850;
    }

    .canvas-size {
      padding: 4px 7px;
      border: 1px solid rgba(124,92,255,.22);
      border-radius: 999px;
      color: #b8adff;
      background: rgba(124,92,255,.08);
      font-size: 8px;
      font-weight: 850;
    }

    .canvas-wrap {
      width: min(78vw, 360px);
      aspect-ratio: 1/1;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      background: #101018;
      touch-action: none;
    }

    .canvas-container {
      width: 100% !important;
      height: 100% !important;
    }

    .canvas-container canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .empty-tip {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      color: #777789;
    }

    .empty-tip strong {
      color: #a0a0b0;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .empty-tip span {
      font-size: 9px;
      line-height: 1.5;
      max-width: 210px;
    }

    .empty-tip.hidden {
      display: none;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 7px;
      margin-top: 8px;
    }

    .quick-btn {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: #dedee9;
      background: rgba(255,255,255,.035);
      font-size: 9px;
      font-weight: 850;
      cursor: pointer;
    }

    .quick-btn.primary {
      border-color: rgba(124,92,255,.24);
      color: #fff;
      background:
        linear-gradient(
          135deg,
          rgba(124,92,255,.2),
          rgba(67,135,255,.13)
        );
    }

    .controls-panel {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding-right: 2px;
    }

    .controls-panel::-webkit-scrollbar {
      width: 4px;
    }

    .controls-panel::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.12);
      border-radius: 999px;
    }

    .selected-summary {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 11px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(17,17,29,.97);
      backdrop-filter: blur(14px);
    }

    .selected-name {
      min-width: 0;
      font-size: 10px;
      font-weight: 850;
    }

    .selected-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 8px;
    }

    .lock-chip {
      min-width: 70px;
      min-height: 32px;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: #cccbd8;
      background: rgba(255,255,255,.035);
      font-size: 9px;
      font-weight: 850;
      cursor: pointer;
    }

    .lock-chip.locked {
      border-color: rgba(124,92,255,.28);
      color: #c8bfff;
      background: rgba(124,92,255,.10);
    }

    .no-selection {
      padding: 18px 12px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: #777789;
      background: rgba(255,255,255,.018);
      text-align: center;
      font-size: 9px;
      line-height: 1.5;
    }

    .accordion {
      margin-bottom: 7px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(17,17,29,.92);
    }

    .accordion-head {
      width: 100%;
      min-height: 42px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 0;
      color: #e7e7ef;
      background: transparent;
      font-size: 10px;
      font-weight: 850;
      cursor: pointer;
    }

    .accordion-head span:last-child {
      color: #7f7f90;
      transition: transform .18s ease;
    }

    .accordion.open .accordion-head span:last-child {
      transform: rotate(180deg);
    }

    .accordion-body {
      display: none;
      padding: 0 11px 11px;
      border-top: 1px solid rgba(255,255,255,.055);
    }

    .accordion.open .accordion-body {
      display: block;
    }

    .field {
      margin-top: 11px;
    }

    .field label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      color: #b7b7c5;
      font-size: 9px;
      font-weight: 750;
    }

    .field-value {
      color: #89899a;
      font-size: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--purple);
    }

    input[type="color"] {
      width: 100%;
      height: 38px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0f0f18;
    }

    select,
    .text-input {
      width: 100%;
      min-height: 39px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      color: #eeeef5;
      background: #0f0f18;
      font-size: 10px;
      font-weight: 700;
    }

    .move-step-row {
      display: grid;
      grid-template-columns: 1fr 68px;
      gap: 7px;
      align-items: center;
    }

    .step-number {
      width: 100%;
      min-height: 38px;
      padding: 0 7px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: #fff;
      background: #0f0f18;
      text-align: center;
      font-size: 10px;
      font-weight: 850;
    }

    .arrows {
      width: 158px;
      margin: 10px auto 0;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      grid-template-rows: repeat(3,42px);
      gap: 6px;
    }

    .arrow-btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #f3f3f8;
      background: rgba(255,255,255,.04);
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .arrow-btn:active {
      background: rgba(124,92,255,.15);
      border-color: rgba(124,92,255,.26);
    }

    .arrow-up {
      grid-column: 2;
      grid-row: 1;
    }

    .arrow-left {
      grid-column: 1;
      grid-row: 2;
    }

    .arrow-center {
      grid-column: 2;
      grid-row: 2;
      border-style: dashed;
      color: #777789;
      font-size: 9px;
    }

    .arrow-right {
      grid-column: 3;
      grid-row: 2;
    }

    .arrow-down {
      grid-column: 2;
      grid-row: 3;
    }

    .button-grid-2 {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .small-btn {
      min-height: 38px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #d0d0dc;
      background: rgba(255,255,255,.035);
      font-size: 9px;
      font-weight: 850;
      cursor: pointer;
    }

    .small-btn.active {
      border-color: rgba(124,92,255,.28);
      color: #c9c1ff;
      background: rgba(124,92,255,.09);
    }

    .small-btn.danger {
      border-color: rgba(255,96,116,.2);
      color: #ff8190;
      background: rgba(255,96,116,.055);
    }

    .align-row {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 6px;
    }

    .color-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .save-area {
      position: sticky;
      bottom: 0;
      z-index: 5;
      padding-top: 7px;
      background:
        linear-gradient(
          to top,
          var(--bg) 78%,
          transparent
        );
    }

    .save-btn {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );
      box-shadow: 0 12px 30px rgba(84,70,255,.22);
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .save-note {
      margin-top: 6px;
      padding-bottom: 3px;
      color: #737385;
      font-size: 8px;
      line-height: 1.45;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0,0,0,.68);
      backdrop-filter: blur(7px);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(100%, 460px);
      max-height: min(82dvh, 720px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      border-radius: 18px;
      background: #11111d;
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
    }

    .modal-head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 12px;
      font-weight: 900;
    }

    .modal-close {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: #d7d7e2;
      background: rgba(255,255,255,.035);
      cursor: pointer;
    }

    .modal-body {
      min-height: 0;
      overflow-y: auto;
      padding: 12px;
    }

    .saved-grid {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 9px;
    }

    .saved-card {
      padding: 7px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,.02);
    }

    .saved-preview {
      width: 100%;
      aspect-ratio: 1/1;
      display: block;
      object-fit: cover;
      border-radius: 9px;
      background: #0d0d15;
    }

    .saved-title {
      margin-top: 7px;
      color: #d2d2dc;
      font-size: 8px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .saved-actions {
      display: grid;
      grid-template-columns: 1fr 34px;
      gap: 6px;
      margin-top: 7px;
    }

    .saved-open,
    .saved-delete {
      min-height: 34px;
      border-radius: 8px;
      font-size: 8px;
      font-weight: 850;
      cursor: pointer;
    }

    .saved-open {
      border: 0;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          rgba(124,92,255,.96),
          rgba(67,135,255,.96)
        );
    }

    .saved-delete {
      border: 1px solid rgba(255,96,116,.18);
      color: #ff8392;
      background: rgba(255,96,116,.05);
    }

    .empty-library {
      grid-column: 1/-1;
      padding: 26px 12px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: #777789;
      text-align: center;
      font-size: 9px;
    }

    .confirm-modal {
      width: min(100%, 370px);
      padding: 17px;
      border: 1px solid var(--border-strong);
      border-radius: 17px;
      background: #11111d;
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
    }

    .confirm-modal h3 {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .confirm-modal p {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.55;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 20000;
      max-width: calc(100vw - 30px);
      padding: 10px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      color: #efeff5;
      background: rgba(18,18,29,.97);
      box-shadow: 0 14px 40px rgba(0,0,0,.38);
      font-size: 9px;
      font-weight: 800;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%,12px);
      transition: .2s ease;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%,0);
    }

    .hidden-input {
      display: none;
    }

    @media (min-width: 900px) {
      .app-shell {
        padding: 18px 22px;
        gap: 14px;
      }

      .topbar {
        max-width: 1180px;
        width: 100%;
        margin: 0 auto;
        min-height: 60px;
        padding: 10px 14px;
      }

      .logo-link img {
        width: 132px;
      }

      .main-layout {
        width: 100%;
        max-width: 1180px;
        margin: 0 auto;
        grid-template-columns: minmax(0,1.08fr) minmax(340px,.72fr);
        grid-template-rows: minmax(0,1fr);
        align-items: stretch;
      }

      .canvas-panel {
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 15px;
      }

      .canvas-wrap {
        width: min(62vh, 620px);
        max-width: 100%;
      }

      .quick-actions {
        width: min(62vh,620px);
        max-width: 100%;
        margin: 10px auto 0;
      }

      .controls-panel {
        height: 100%;
        padding-right: 4px;
      }

      .saved-grid {
        grid-template-columns: repeat(3,minmax(0,1fr));
      }
    }

    @media (max-width: 380px) {
      .page-name {
        display: none;
      }

      .logo-link img {
        width: 95px;
      }

      .top-btn {
        padding: 0 8px;
        font-size: 9px;
      }

      .canvas-wrap {
        width: min(75vw,330px);
      }
    }
  </style>
</head>

<body>

<div class="app-shell">

  <header class="topbar">

    <div class="topbar-left">
      <a href="index.html" class="logo-link" aria-label="Viral1s Home">
        <img src="viral1s-logo.webp" alt="Viral1s">
      </a>
    </div>

    <div class="page-name">
      Image Creator
    </div>

    <div class="topbar-right">
      <button id="undoBtn" class="icon-btn" type="button" title="Undo">↶</button>
      <button id="redoBtn" class="icon-btn" type="button" title="Redo">↷</button>
      <button id="newBtn" class="top-btn" type="button">New</button>
      <button id="myImagesBtn" class="top-btn primary" type="button">My Images</button>
    </div>

  </header>


  <main class="main-layout">

    <section class="canvas-panel">

      <div class="canvas-panel-head">
        <div class="canvas-title">Create your image</div>
        <div class="canvas-size">1:1 · 1080×1080</div>
      </div>

      <div id="canvasWrap" class="canvas-wrap">

        <div id="emptyTip" class="empty-tip">
          <strong>Start creating</strong>
          <span>Add a background, image or text.</span>
        </div>

        <canvas
          id="imageCanvas"
          width="1080"
          height="1080"
        ></canvas>

      </div>

      <div class="quick-actions">

        <button id="backgroundBtn" class="quick-btn primary" type="button">
          + Background
        </button>

        <button id="imageBtn" class="quick-btn" type="button">
          + Image / PNG
        </button>

        <button id="textBtn" class="quick-btn" type="button">
          + Text
        </button>

      </div>

    </section>


    <section id="controlsPanel" class="controls-panel">

      <div id="noSelection" class="no-selection">
        Select an element on the image to show its controls.
      </div>


      <div id="selectedUI" class="hidden">

        <div class="selected-summary">

          <div>
            <div id="selectedName" class="selected-name">
              Selected element
            </div>

            <div id="selectedSub" class="selected-sub">
              Tap outside to deselect
            </div>
          </div>

          <button
            id="lockBtn"
            class="lock-chip"
            type="button"
          >
            🔓 Unlocked
          </button>

        </div>


        <div class="accordion" data-accordion="move">

          <button class="accordion-head" type="button">
            <span>Move</span>
            <span>⌄</span>
          </button>

          <div class="accordion-body">

            <div class="field">

              <label>
                Move step
                <span id="moveStepText" class="field-value">
                  8px
                </span>
              </label>

              <div class="move-step-row">

                <input
                  id="moveStepRange"
                  type="range"
                  min="1"
                  max="30"
                  value="8"
                >

                <input
                  id="moveStepNumber"
                  class="step-number"
                  type="number"
                  min="1"
                  max="30"
                  value="8"
                >

              </div>

            </div>


            <div class="arrows">

              <button
                class="arrow-btn arrow-up"
                data-move="up"
                type="button"
              >
                ↑
              </button>

              <button
                class="arrow-btn arrow-left"
                data-move="left"
                type="button"
              >
                ←
              </button>

              <button
                class="arrow-btn arrow-center"
                type="button"
                disabled
              >
                MOVE
              </button>

              <button
                class="arrow-btn arrow-right"
                data-move="right"

<script>
  const LOGICAL_SIZE = 1080;

  const canvasWrap =
    document.getElementById("canvasWrap");

  const emptyTip =
    document.getElementById("emptyTip");

  const noSelection =
    document.getElementById("noSelection");

  const selectedUI =
    document.getElementById("selectedUI");

  const selectedName =
    document.getElementById("selectedName");

  const selectedSub =
    document.getElementById("selectedSub");

  const lockBtn =
    document.getElementById("lockBtn");

  const textAccordion =
    document.getElementById("textAccordion");

  const backgroundBtn =
    document.getElementById("backgroundBtn");

  const imageBtn =
    document.getElementById("imageBtn");

  const textBtn =
    document.getElementById("textBtn");

  const backgroundInput =
    document.getElementById("backgroundInput");

  const imageInput =
    document.getElementById("imageInput");

  const moveStepRange =
    document.getElementById("moveStepRange");

  const moveStepNumber =
    document.getElementById("moveStepNumber");

  const moveStepText =
    document.getElementById("moveStepText");

  const scaleRange =
    document.getElementById("scaleRange");

  const scaleText =
    document.getElementById("scaleText");

  const rotationRange =
    document.getElementById("rotationRange");

  const rotationText =
    document.getElementById("rotationText");

  const fontFamily =
    document.getElementById("fontFamily");

  const fontSizeRange =
    document.getElementById("fontSizeRange");

  const fontSizeText =
    document.getElementById("fontSizeText");

  const boldBtn =
    document.getElementById("boldBtn");

  const italicBtn =
    document.getElementById("italicBtn");

  const textColor =
    document.getElementById("textColor");

  const strokeColor =
    document.getElementById("strokeColor");

  const strokeWidthRange =
    document.getElementById("strokeWidthRange");

  const strokeWidthText =
    document.getElementById("strokeWidthText");

  const opacityRange =
    document.getElementById("opacityRange");

  const opacityText =
    document.getElementById("opacityText");

  const bringForwardBtn =
    document.getElementById("bringForwardBtn");

  const sendBackwardBtn =
    document.getElementById("sendBackwardBtn");

  const duplicateBtn =
    document.getElementById("duplicateBtn");

  const deleteBtn =
    document.getElementById("deleteBtn");

  const undoBtn =
    document.getElementById("undoBtn");

  const redoBtn =
    document.getElementById("redoBtn");

  const newBtn =
    document.getElementById("newBtn");

  const myImagesBtn =
    document.getElementById("myImagesBtn");

  const saveBtn =
    document.getElementById("saveBtn");

  const libraryModal =
    document.getElementById("libraryModal");

  const closeLibraryBtn =
    document.getElementById("closeLibraryBtn");

  const savedGrid =
    document.getElementById("savedGrid");

  const confirmBackdrop =
    document.getElementById("confirmBackdrop");

  const confirmTitle =
    document.getElementById("confirmTitle");

  const confirmText =
    document.getElementById("confirmText");

  const confirmCancelBtn =
    document.getElementById("confirmCancelBtn");

  const confirmOkBtn =
    document.getElementById("confirmOkBtn");

  const toast =
    document.getElementById("toast");


  let currentProjectId = null;

  let database = null;

  let isDirty = false;

  let history = [];

  let historyIndex = -1;

  let restoringHistory = false;

  let confirmAction = null;

  let moveHoldTimeout = null;

  let moveHoldInterval = null;


  const canvas =
    new fabric.Canvas(
      "imageCanvas",
      {
        width: LOGICAL_SIZE,
        height: LOGICAL_SIZE,
        preserveObjectStacking: true,
        selectionColor:
          "rgba(124,92,255,.12)",
        selectionBorderColor:
          "#7c5cff",
        selectionLineWidth: 2
      }
    );


  canvas.backgroundColor =
    "#101018";


  fabric.Object.prototype.set({
    transparentCorners: false,
    cornerColor: "#7c5cff",
    cornerStrokeColor: "#ffffff",
    borderColor: "#7c5cff",
    cornerSize: 24,
    padding: 4,
    rotatingPointOffset: 34
  });


  function resizeCanvasDisplay() {

    const size =
      canvasWrap.clientWidth;

    canvas.setDimensions(
      {
        width: size,
        height: size
      },
      {
        cssOnly: true
      }
    );

    canvas.setZoom(
      size / LOGICAL_SIZE
    );

    canvas.requestRenderAll();

  }


  window.addEventListener(
    "resize",
    resizeCanvasDisplay
  );


  requestAnimationFrame(
    resizeCanvasDisplay
  );


  function showToast(message) {

    toast.textContent =
      message;

    toast.classList.add("show");

    clearTimeout(
      showToast.timer
    );

    showToast.timer =
      setTimeout(
        () => {
          toast.classList.remove(
            "show"
          );
        },
        2100
      );

  }


  function getActive() {
    return canvas.getActiveObject();
  }


  function isTextObject(object) {

    if (!object) return false;

    return (
      object.type === "i-text" ||
      object.type === "text" ||
      object.type === "textbox"
    );

  }


  function isBackgroundObject(object) {
    return Boolean(
      object &&
      object.isViralBackground
    );
  }


  function updateEmptyState() {

    emptyTip.classList.toggle(
      "hidden",
      canvas.getObjects().length > 0
    );

  }


  function setDirty(value = true) {
    isDirty = value;
  }


  function serializeCanvas() {

    return JSON.stringify(
      canvas.toJSON([
        "isViralBackground",
        "viralLocked"
      ])
    );

  }


  function pushHistory() {

    if (restoringHistory) {
      return;
    }

    const snapshot =
      serializeCanvas();

    if (
      history[historyIndex] ===
      snapshot
    ) {
      return;
    }

    history =
      history.slice(
        0,
        historyIndex + 1
      );

    history.push(snapshot);

    if (history.length > 60) {
      history.shift();
    }

    historyIndex =
      history.length - 1;

    updateUndoRedo();

  }


  function updateUndoRedo() {

    undoBtn.disabled =
      historyIndex <= 0;

    redoBtn.disabled =
      historyIndex >=
      history.length - 1;

    undoBtn.style.opacity =
      undoBtn.disabled
        ? ".4"
        : "1";

    redoBtn.style.opacity =
      redoBtn.disabled
        ? ".4"
        : "1";

  }


  function restoreSnapshot(snapshot) {

    if (!snapshot) {
      return;
    }

    restoringHistory = true;

    canvas.loadFromJSON(
      snapshot,
      () => {

        normalizeLoadedObjects();

        canvas.renderAll();

        restoringHistory = false;

        updateEmptyState();

        updateSelectionUI();

        setDirty(true);

      }
    );

  }


  undoBtn.addEventListener(
    "click",
    () => {

      if (historyIndex <= 0) {
        return;
      }

      historyIndex--;

      restoreSnapshot(
        history[historyIndex]
      );

      updateUndoRedo();

    }
  );


  redoBtn.addEventListener(
    "click",
    () => {

      if (
        historyIndex >=
        history.length - 1
      ) {
        return;
      }

      historyIndex++;

      restoreSnapshot(
        history[historyIndex]
      );

      updateUndoRedo();

    }
  );


  function normalizeLoadedObjects() {

    canvas.getObjects().forEach(
      (object) => {

        const locked =
          Boolean(
            object.viralLocked
          );

        applyLockState(
          object,
          locked,
          false
        );

      }
    );

  }


  function initializeHistory() {

    history = [
      serializeCanvas()
    ];

    historyIndex = 0;

    updateUndoRedo();

  }


  canvas.on(
    "object:modified",
    () => {

      setDirty();

      pushHistory();

      updateSelectionUI();

    }
  );


  canvas.on(
    "object:added",
    () => {

      updateEmptyState();

    }
  );


  canvas.on(
    "object:removed",
    () => {

      updateEmptyState();

    }
  );


  canvas.on(
    "selection:created",
    updateSelectionUI
  );

  canvas.on(
    "selection:updated",
    updateSelectionUI
  );

  canvas.on(
    "selection:cleared",
    updateSelectionUI
  );


  canvas.on(
    "mouse:down",
    event => {

      if (!event.target) {
        canvas.discardActiveObject();
        canvas.requestRenderAll();
        updateSelectionUI();
      }

    }
  );


  function updateSelectionUI() {

    const object =
      getActive();

    if (!object) {

      noSelection.classList.remove(
        "hidden"
      );

      selectedUI.classList.add(
        "hidden"
      );

      return;
    }

    noSelection.classList.add(
      "hidden"
    );

    selectedUI.classList.remove(
      "hidden"
    );

    if (isBackgroundObject(object)) {

      selectedName.textContent =
        "Background";

    } else if (isTextObject(object)) {

      selectedName.textContent =
        "Text";

    } else {

      selectedName.textContent =
        "Image / PNG";

    }

    selectedSub.textContent =
      object.viralLocked
        ? "Locked element"
        : "Tap outside to deselect";

    updateLockButton(object);

    updateSizeControls(object);

    updateOpacityControl(object);

    updateTextControls(object);

  }


  function updateSizeControls(object) {

    const scalePercent =
      Math.round(
        (
          (
            object.scaleX +
            object.scaleY
          ) / 2
        ) *
        100
      );

    scaleRange.value =
      Math.max(
        10,
        Math.min(
          300,
          scalePercent
        )
      );

    scaleText.textContent =
      `${scaleRange.value}%`;

    rotationRange.value =
      Math.round(
        object.angle || 0
      );

    rotationText.textContent =
      `${rotationRange.value}°`;

  }


  function updateOpacityControl(object) {

    const value =
      Math.round(
        (object.opacity ?? 1) *
        100
      );

    opacityRange.value =
      value;

    opacityText.textContent =
      `${value}%`;

  }


  function updateTextControls(object) {

    const textMode =
      isTextObject(object);

    textAccordion.classList.toggle(
      "hidden",
      !textMode
    );

    if (!textMode) {
      return;
    }

    fontFamily.value =
      object.fontFamily ||
      "Arial";

    fontSizeRange.value =
      Math.round(
        object.fontSize || 72
      );

    fontSizeText.textContent =
      fontSizeRange.value;

    boldBtn.classList.toggle(
      "active",
      object.fontWeight === "bold" ||
      Number(object.fontWeight) >= 700
    );

    italicBtn.classList.toggle(
      "active",
      object.fontStyle === "italic"
    );

    document
      .querySelectorAll(".align-btn")
      .forEach(
        button => {

          button.classList.toggle(
            "active",
            button.dataset.align ===
            object.textAlign
          );

        }
      );

    if (
      typeof object.fill === "string" &&
      object.fill.startsWith("#")
    ) {
      textColor.value =
        object.fill;
    }

    if (
      typeof object.stroke === "string" &&
      object.stroke.startsWith("#")
    ) {
      strokeColor.value =
        object.stroke;
    }

    strokeWidthRange.value =
      object.strokeWidth || 0;

    strokeWidthText.textContent =
      strokeWidthRange.value;

  }


  function updateLockButton(object) {

    const locked =
      Boolean(
        object.viralLocked
      );

    lockBtn.classList.toggle(
      "locked",
      locked
    );

    lockBtn.textContent =
      locked
        ? "🔒 Locked"
        : "🔓 Unlocked";

  }


  function applyLockState(
    object,
    locked,
    markDirty = true
  ) {

    object.viralLocked =
      locked;

    object.set({
      lockMovementX: locked,
      lockMovementY: locked,
      lockScalingX: locked,
      lockScalingY: locked,
      lockRotation: locked,
      hasControls: !locked
    });

    if (markDirty) {
      setDirty();
      pushHistory();
    }

    canvas.requestRenderAll();

    updateSelectionUI();

  }


  lockBtn.addEventListener(
    "click",
    () => {

      const object =
        getActive();

      if (!object) {
        return;
      }

      applyLockState(
        object,
        !object.viralLocked
      );

    }
  );


  function readFileAsDataURL(file) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();

        reader.onload =
          () => resolve(
            reader.result
          );

        reader.onerror =
          reject;

        reader.readAsDataURL(
          file
        );

      }
    );

  }


  function loadFabricImage(dataUrl) {

    return new Promise(
      (resolve, reject) => {

        fabric.Image.fromURL(
          dataUrl,
          image => {

            if (!image) {
              reject(
                new Error(
                  "Image load failed"
                )
              );

              return;
            }

            resolve(image);

          },
          {
            crossOrigin: "anonymous"
          }
        );

      }
    );

  }


  async function addBackground(file) {

    try {

      const dataUrl =
        await readFileAsDataURL(
          file
        );

      const image =
        await loadFabricImage(
          dataUrl
        );

      const scale =
        Math.max(
          LOGICAL_SIZE /
          image.width,
          LOGICAL_SIZE /
          image.height
        );

      image.set({
        left: LOGICAL_SIZE / 2,
        top: LOGICAL_SIZE / 2,
        originX: "center",
        originY: "center",
        scaleX: scale,
        scaleY: scale,
        angle: 0,
        isViralBackground: true,
        viralLocked: false
      });

      const oldBackground =
        canvas
          .getObjects()
          .find(
            object =>
              isBackgroundObject(
                object
              )
          );

      if (oldBackground) {
        canvas.remove(
          oldBackground
        );
      }

      canvas.add(image);

      canvas.sendToBack(image);

      canvas.setActiveObject(
        image
      );

      canvas.requestRenderAll();

      setDirty();

      pushHistory();

      updateSelectionUI();

    } catch (error) {

      console.error(error);

      showToast(
        "Could not add background."
      );

    }

  }


  async function addImage(file) {

    try {

      const dataUrl =
        await readFileAsDataURL(
          file
        );

      const image =
        await loadFabricImage(
          dataUrl
        );

      const maxSize =
        LOGICAL_SIZE * .58;

      const scale =
        Math.min(
          maxSize /
          image.width,
          maxSize /
          image.height,
          1
        );

      image.set({
        left: LOGICAL_SIZE / 2,
        top: LOGICAL_SIZE / 2,
        originX: "center",
        originY: "center",
        scaleX: scale,
        scaleY: scale,
        angle: 0,
        viralLocked: false
      });

      canvas.add(image);

      ensureBackgroundAtBack();

      canvas.setActiveObject(
        image
      );

      canvas.requestRenderAll();

      setDirty();

      pushHistory();

      updateSelectionUI();

    } catch (error) {

      console.error(error);

      showToast(
        "Could not add image."
      );

    }

  }


  function addText() {

    const text =
      new fabric.IText(
        "Your text",
        {
          left: LOGICAL_SIZE / 2,
          top: LOGICAL_SIZE / 2,
          originX: "center",
          originY: "center",
          fill: "#ffffff",
          fontFamily: "Arial",
          fontSize: 72,
          fontWeight: "bold",
          textAlign: "center",
          stroke: "#000000",
          strokeWidth: 0,
          viralLocked: false
        }
      );

    canvas.add(text);

    ensureBackgroundAtBack();

    canvas.setActiveObject(
      text
    );

    canvas.requestRenderAll();

    setDirty();

    pushHistory();

    updateSelectionUI();

    setTimeout(
      () => {

        text.enterEditing();
        text.selectAll();
        canvas.requestRenderAll();

      },
      70
    );

  }


  function ensureBackgroundAtBack() {

    const background =
      canvas
        .getObjects()
        .find(
          object =>
            isBackgroundObject(
              object
            )
        );

    if (background) {
      canvas.sendToBack(
        background
      );
    }

  }


  backgroundBtn.addEventListener(
    "click",
    () => {
      backgroundInput.click();
    }
  );


  imageBtn.addEventListener(
    "click",
    () => {
      imageInput.click();
    }
  );


  textBtn.addEventListener(
    "click",
    addText
  );


  backgroundInput.addEventListener(
    "change",
    async () => {

      const file =
        backgroundInput.files[0];

      if (!file) {
        return;
      }

      await addBackground(
        file
      );

      backgroundInput.value = "";

    }
  );


  imageInput.addEventListener(
    "change",
    async () => {

      const file =
        imageInput.files[0];

      if (!file) {
        return;
      }

      await addImage(
        file
      );

      imageInput.value = "";

    }
  );


  function syncMoveStep(value) {

    const normalized =
      Math.max(
        1,
        Math.min(
          30,
          Number(value) || 8
        )
      );

    moveStepRange.value =
      normalized;

    moveStepNumber.value =
      normalized;

    moveStepText.textContent =
      `${normalized}px`;

    localStorage.setItem(
      "viral1s_image_move_step",
      String(normalized)
    );

  }


  const savedMoveStep =
    Number(
      localStorage.getItem(
        "viral1s_image_move_step"
      )
    ) || 8;


  syncMoveStep(
    savedMoveStep

  function moveSelected(direction) {

    const object =
      getActive();

    if (
      !object ||
      object.viralLocked
    ) {
      return;
    }

    const step =
      Number(
        moveStepRange.value
      );

    let left =
      object.left || 0;

    let top =
      object.top || 0;

    if (direction === "up") {
      top -= step;
    }

    if (direction === "down") {
      top += step;
    }

    if (direction === "left") {
      left -= step;
    }

    if (direction === "right") {
      left += step;
    }

    object.set({
      left,
      top
    });

    object.setCoords();

    canvas.requestRenderAll();

    setDirty();

  }


  function stopMoveHold() {

    clearTimeout(
      moveHoldTimeout
    );

    clearInterval(
      moveHoldInterval
    );

    moveHoldTimeout = null;
    moveHoldInterval = null;

    if (getActive()) {
      pushHistory();
    }

  }


  document
    .querySelectorAll(
      "[data-move]"
    )
    .forEach(
      button => {

        const direction =
          button.dataset.move;

        button.addEventListener(
          "pointerdown",
          event => {

            event.preventDefault();

            moveSelected(
              direction
            );

            moveHoldTimeout =
              setTimeout(
                () => {

                  moveHoldInterval =
                    setInterval(
                      () => {
                        moveSelected(
                          direction
                        );
                      },
                      70
                    );

                },
                320
              );

          }
        );

        [
          "pointerup",
          "pointercancel",
          "pointerleave"
        ].forEach(
          eventName => {

            button.addEventListener(
              eventName,
              stopMoveHold
            );

          }
        );

      }
    );

      ) {
        return;

      object.clone(
        clone => {

          clone.set({
            left:
              (object.left || 0) + 45,
            top:
              (object.top || 0) + 45,
            isViralBackground: false,
            viralLocked: false

          applyLockState(
            clone,
            false,
            false

          canvas.add(clone);

          ensureBackgroundAtBack();

          canvas.setActiveObject(
            clone

          canvas.requestRenderAll();

          setDirty();

          pushHistory();

          updateSelectionUI();

        }
      );

    }

  function loadAccordionPreferences() {

    let saved = [];

    try {

      saved =
        JSON.parse(
          localStorage.getItem(
            "viral1s_image_open_controls"
          ) || "[]"
        );

    } catch {
      saved = [];
    }

    document
      .querySelectorAll(
        ".accordion"
      )
      .forEach(
        accordion => {

          if (
            saved.includes(
              accordion.dataset.accordion
            )
          ) {
            accordion.classList.add(
              "open"
            );
          }

        }
      );

  }


  function saveAccordionPreferences() {

    const open =
      Array.from(
        document.querySelectorAll(
          ".accordion.open"

      ).map(

      "viral1s_image_open_controls",

  function resetProject() {

    canvas.clear();

    canvas.backgroundColor =
      "#101018";

    canvas.renderAll();

    currentProjectId = null;

    isDirty = false;

    saveBtn.textContent =
      "Save Image";

    initializeHistory();

    updateEmptyState();

    updateSelectionUI();

    showToast(
      "New image started"
    );

  }

    () => {

      if (
        isDirty ||
        canvas.getObjects().length
      ) {

        openConfirm(
          "Start a new image?",
          "Unsaved changes will be lost.",
          resetProject
        );

        return;
      }

      resetProject();

    }
  );


  /* INDEXED DB */

  function openDatabase() {

    return new Promise(
      (resolve,reject) => {

        const request =
          indexedDB.open(
            "viral1s_image_creator",
            2
          );

        request.onupgradeneeded =
          () => {

            const db =
              request.result;

            if (
              !db.objectStoreNames.contains(
                "projects"
              )
            ) {

              db.createObjectStore(
                "projects",
                {
                  keyPath: "id"
                }
              );

            }

          };

        request.onsuccess =
          () => resolve(
            request.result
          );

        request.onerror =
          () => reject(
            request.error
          );

      }
    );

  }


  function saveProjectRecord(record) {

    return new Promise(
      (resolve,reject) => {

        const transaction =
          database.transaction(
            "projects",
            "readwrite"
          );

        const store =
          transaction.objectStore(
            "projects"
          );

        const request =
          store.put(record);

        request.onsuccess =
          () => resolve();

        request.onerror =
          () => reject(
            request.error
          );

      }
    );

  }


  function getAllProjects() {

    return new Promise(
      (resolve,reject) => {

        const transaction =
          database.transaction(
            "projects",
            "readonly"
          );

        const store =
          transaction.objectStore(
            "projects"
          );

        const request =
          store.getAll();

        request.onsuccess =
          () => resolve(
            request.result || []
          );

        request.onerror =
          () => reject(
            request.error
          );

      }
    );

  }


  function getProject(id) {

    return new Promise(
      (resolve,reject) => {

        const transaction =
          database.transaction(
            "projects",
            "readonly"
          );

        const store =
          transaction.objectStore(
            "projects"
          );

        const request =
          store.get(id);

        request.onsuccess =
          () => resolve(
            request.result
          );

        request.onerror =
          () => reject(
            request.error
          );

      }
    );

  }


  function deleteProject(id) {

    return new Promise(
      (resolve,reject) => {

        const transaction =
          database.transaction(
            "projects",
            "readwrite"
          );

        const store =
          transaction.objectStore(
            "projects"
          );

        const request =
          store.delete(id);

        request.onsuccess =
          () => resolve();

        request.onerror =
          () => reject(
            request.error
          );

      }
    );

  }


  function makeProjectId() {

    if (
      window.crypto &&
      crypto.randomUUID
    ) {
      return crypto.randomUUID();
    }

    return (
      "project_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2)
    );

  }


  async function saveCurrentProject() {

    if (!database) {
      showToast(
        "Storage is not ready."
      );
      return;
    }

    saveBtn.disabled = true;

    const isUpdate =
      Boolean(
        currentProjectId
      );

    saveBtn.textContent =
      isUpdate
        ? "Updating..."
        : "Saving...";

    try {

      canvas.discardActiveObject();

      canvas.requestRenderAll();

      const id =
        currentProjectId ||
        makeProjectId();

      const preview =
        canvas.toDataURL({
          format: "jpeg",
          quality: .78,
          multiplier: .28
        });

      const existing =
        currentProjectId
          ? await getProject(
              currentProjectId
            )
          : null;

      const record = {
        id,
        name:
          existing?.name ||
          `Image ${new Date().toLocaleDateString()}`,
        createdAt:
          existing?.createdAt ||
          Date.now(),
        updatedAt:
          Date.now(),
        canvasJson:
          serializeCanvas(),
        preview
      };

      await saveProjectRecord(
        record
      );

      currentProjectId = id;

      isDirty = false;

      saveBtn.textContent =
        "Update Image";

      showToast(
        isUpdate
          ? "Image updated ✓"
          : "Image saved ✓"
      );

      await renderLibrary();

    } catch (error) {

      console.error(error);

      showToast(
        "Could not save image."
      );

      saveBtn.textContent =
        currentProjectId
          ? "Update Image"
          : "Save Image";

    }

    saveBtn.disabled = false;

  }


  saveBtn.addEventListener(
    "click",
    saveCurrentProject
  );


  async function openSavedProject(id) {

    try {

      const project =
        await getProject(id);

      if (!project) {
        return;
      }

      const loadIt =
        () => {

          restoringHistory = true;

          canvas.loadFromJSON(
            project.canvasJson,
            () => {

              normalizeLoadedObjects();

              currentProjectId =
                project.id;

              isDirty = false;

              saveBtn.textContent =
                "Update Image";

              canvas.renderAll();

              resizeCanvasDisplay();

              initializeHistory();

              restoringHistory = false;

              updateEmptyState();

              updateSelectionUI();

              closeLibrary();

              showToast(
                "Image opened"
              );

            }
          );

        };


      if (isDirty) {

        openConfirm(
          "Open saved image?",
          "Unsaved changes in the current image will be lost.",
          loadIt
        );

        return;
      }

      loadIt();

    } catch (error) {

      console.error(error);

      showToast(
        "Could not open image."
      );

    }

  }


  async function removeSavedProject(id) {

    openConfirm(
      "Delete saved image?",
      "This saved project will be removed from this device.",
      async () => {

        try {

          await deleteProject(
            id
          );

          if (
            currentProjectId === id
          ) {

            currentProjectId = null;

            saveBtn.textContent =
              "Save Image";

          }

          await renderLibrary();

          showToast(
            "Saved image deleted"
          );

        } catch (error) {

          console.error(error);

          showToast(
            "Could not delete image."
          );

        }

      }
    );

  }


  async function renderLibrary() {

    if (!database) {
      return;
    }

    const projects =
      await getAllProjects();

    projects.sort(
      (a,b) =>
        b.updatedAt -
        a.updatedAt
    );

    savedGrid.innerHTML = "";

    if (!projects.length) {

      savedGrid.innerHTML =
        `
          <div class="empty-library">
            Your saved images will appear here.
          </div>
        `;

      return;
    }

    projects.forEach(
      project => {

        const card =
          document.createElement(
            "article"
          );

        card.className =
          "saved-card";

        const preview =
          document.createElement(
            "img"
          );

        preview.className =
          "saved-preview";

        preview.src =
          project.preview;

        preview.alt =
          "Saved Viral1s image";

        const title =
          document.createElement(
            "div"
          );

        title.className =
          "saved-title";

        title.textContent =
          project.name;

        const actions =
          document.createElement(
            "div"
          );

        actions.className =
          "saved-actions";

        const open =
          document.createElement(
            "button"
          );

        open.className =
          "saved-open";

        open.type =
          "button";

        open.textContent =
          "Edit";

        open.addEventListener(
          "click",
          () => {
            openSavedProject(
              project.id
            );
          }
        );

        const remove =
          document.createElement(
            "button"
          );

        remove.className =
          "saved-delete";

        remove.type =
          "button";

        remove.textContent =
          "×";

        remove.addEventListener(
          "click",
          () => {
            removeSavedProject(
              project.id
            );
          }
        );

        actions.append(
          open,
          remove
        );

        card.append(
          preview,
          title,
          actions
        );

        savedGrid.appendChild(
          card
        );

      }
    );

  }


  function openLibrary() {

    renderLibrary();

    libraryModal.classList.add(
      "show"
    );

  }


  function closeLibrary() {

    libraryModal.classList.remove(
      "show"
    );

  }


  myImagesBtn.addEventListener(
    "click",
    openLibrary
  );


  closeLibraryBtn.addEventListener(
    "click",
    closeLibrary
  );


  libraryModal.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        libraryModal
      ) {
        closeLibrary();
      }

    }
  );


  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key !== "Delete" &&
        event.key !== "Backspace"
      ) {
        return;
      }

      const object =
        getActive();

      if (
        object &&
        object.isEditing
      ) {
        return;
      }

      if (!object) {
        return;
      }

      canvas.remove(
        object
      );

      canvas.discardActiveObject();

      canvas.requestRenderAll();

      setDirty();

      pushHistory();

      updateSelectionUI();

    }
  );


  async function init() {

    try {

      database =
        await openDatabase();

      await renderLibrary();

    } catch (error) {

      console.error(error);

      showToast(
        "Local storage unavailable."
      );

    }

    initializeHistory();

    updateEmptyState();

    updateSelectionUI();

    resizeCanvasDisplay();

  }


  init();
