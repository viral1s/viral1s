<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Viral1s Admin</title>

  <link
    rel="icon"
    type="image/png"
    href="viral1s-icon.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top,
          #1b1733 0%,
          #0b0b10 45%,
          #070709 100%
        );

      color: #fff;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .admin-card {
      width: 100%;
      max-width: 380px;

      padding: 32px 24px;

      text-align: center;

      border: 1px solid #292936;
      border-radius: 24px;

      background: rgba(18, 18, 24, 0.94);

      box-shadow:
        0 24px 70px
        rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 145px;
      max-width: 70%;

      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;

      font-size: 24px;
    }

    p {
      margin: 0 0 24px;

      color: #9292a0;

      font-size: 14px;
      line-height: 1.5;
    }

    #googleLogin {
      width: 100%;
      min-height: 50px;

      border: 0;
      border-radius: 14px;

      cursor: pointer;

      color: #fff;

      font-size: 14px;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          #765cff,
          #527cff
        );

      box-shadow:
        0 10px 30px
        rgba(100, 92, 255, 0.25);
    }

    #googleLogin:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #status {
      min-height: 20px;

      margin-top: 18px;
      margin-bottom: 0;

      font-size: 12px;

      color: #aaaab5;

      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <main class="admin-card">

    <img
      class="logo"
      src="viral1s-logo.webp"
      alt="Viral1s"
    >

    <h1>Admin</h1>

    <p>
      Sign in with your authorized Google account.
    </p>

    <button
      id="googleLogin"
      type="button"
    >
      Continue with Google
    </button>

    <p id="status"></p>

  </main>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyC4Qp_MUcky6di-rWBBCmBiRICaYsNXi0w",
      authDomain: "viral1s.firebaseapp.com",
      projectId: "viral1s",
      storageBucket: "viral1s.firebasestorage.app",
      messagingSenderId: "1064452367802",
      appId: "1:1064452367802:web:80dd7e24cd78d2cb55a983"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const provider =
      new GoogleAuthProvider();


    const googleLogin =
      document.getElementById("googleLogin");

    const status =
      document.getElementById("status");


    googleLogin.addEventListener(
      "click",
      async () => {

        googleLogin.disabled = true;

        status.textContent =
          "Opening Google sign in...";

        try {

          const result =
            await signInWithPopup(
              auth,
              provider
            );

          const user =
            result.user;
const adminUIDs = [
  "JQkYiVQ1bhgc4i4FYAWomFkAioG3",
  "wzylH7v0wwasLo4YguCVOKsIB2v2"
];

if (!adminUIDs.includes(user.uid)) {
  status.textContent = "Access denied. Admins only.";
  googleLogin.textContent = "Access denied";
  await auth.signOut();
  return;
}
          status.textContent =
            "Signed in successfully.";

          googleLogin.textContent =
            "Signed in ✓";

          console.log(
            "Admin UID:",
            user.uid
          );

        } catch (error) {

          console.error(error);

          status.textContent =
            "Sign in failed: " +
            error.message;

          googleLogin.disabled = false;

        }

      }
    );

  </script>

</body>
</html>
