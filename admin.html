<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Viral1s Admin</title>

  <link
    rel="icon"
    type="image/png"
    href="viral1s-icon.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #070709;
      --panel: #111118;
      --panel-soft: #15151e;
      --border: #292936;
      --text: #ffffff;
      --muted: #9292a0;
      --muted-2: #6f6f7c;
      --purple: #765cff;
      --blue: #527cff;
      --danger: #ff4d61;
      --success: #57d995;
    }

    html {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #1b1733 0%,
          #0b0b10 42%,
          #070709 100%
        );

      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }


    /* LOGIN */

    .login-screen {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .admin-card {
      width: 100%;
      max-width: 390px;

      padding: 32px 24px;

      text-align: center;

      border: 1px solid var(--border);
      border-radius: 24px;

      background:
        rgba(18, 18, 24, 0.94);

      box-shadow:
        0 24px 70px
        rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(18px);
    }

    .login-logo {
      width: 145px;
      max-width: 70%;
      height: auto;

      margin-bottom: 24px;
    }

    .admin-card h1 {
      margin: 0 0 8px;

      font-size: 25px;
    }

    .admin-card > p {
      margin: 0 0 24px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.5;
    }

    #googleLogin {
      width: 100%;
      min-height: 52px;

      border: 0;
      border-radius: 14px;

      cursor: pointer;

      color: #fff;

      font-size: 14px;
      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );

      box-shadow:
        0 10px 30px
        rgba(100, 92, 255, 0.25);

      transition:
        transform 0.18s ease,
        opacity 0.18s ease;
    }

    #googleLogin:active {
      transform: scale(0.98);
    }

    #googleLogin:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #status {
      min-height: 20px;

      margin-top: 18px;
      margin-bottom: 0;

      color: #aaaab5;

      font-size: 12px;
      line-height: 1.5;

      overflow-wrap: anywhere;
    }


    /* DASHBOARD */

    .dashboard {
      width: 100%;
      min-height: 100vh;

      padding:
        20px
        max(18px, env(safe-area-inset-right))
        40px
        max(18px, env(safe-area-inset-left));
    }

    .dashboard-inner {
      width: 100%;
      max-width: 1200px;

      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      padding: 17px 18px;

      border: 1px solid var(--border);
      border-radius: 20px;

      background:
        rgba(17, 17, 24, 0.88);

      box-shadow:
        0 16px 45px
        rgba(0, 0, 0, 0.22);

      backdrop-filter: blur(18px);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;

      min-width: 0;
    }

    .dashboard-logo {
      width: 116px;
      height: auto;

      display: block;
    }

    .admin-badge {
      padding: 5px 9px;

      border: 1px solid
        rgba(118, 92, 255, 0.3);

      border-radius: 999px;

      color: #b9adff;

      background:
        rgba(118, 92, 255, 0.09);

      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.7px;
    }

    #signOutButton {
      min-height: 40px;

      padding: 0 15px;

      border: 1px solid #343440;
      border-radius: 11px;

      cursor: pointer;

      color: #dddde7;

      background: #181820;

      font-size: 12px;
      font-weight: 800;
    }

    .dashboard-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;

      margin: 30px 2px 18px;
    }

    .dashboard-heading h1 {
      margin: 0 0 6px;

      font-size: 29px;
      line-height: 1.1;
      letter-spacing: -0.7px;
    }

    .dashboard-heading p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;
    }

    .message-count {
      flex-shrink: 0;

      padding: 9px 13px;

      border: 1px solid
        rgba(118, 92, 255, 0.27);

      border-radius: 12px;

      color: #c5bcff;

      background:
        rgba(118, 92, 255, 0.08);

      font-size: 12px;
      font-weight: 800;
    }

    .messages-list {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;
    }

    .message-card {
      min-width: 0;

      padding: 20px;

      border: 1px solid var(--border);
      border-radius: 19px;

      background:
        linear-gradient(
          180deg,
          rgba(24, 24, 34, 0.95),
          rgba(15, 15, 22, 0.96)
        );

      box-shadow:
        0 14px 38px
        rgba(0, 0, 0, 0.18);
    }

    .message-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 15px;
    }

    .sender {
      min-width: 0;
    }

    .sender-name {
      margin: 0 0 5px;

      color: #fff;

      font-size: 16px;
      font-weight: 850;

      overflow-wrap: anywhere;
    }

    .sender-email {
      display: inline-block;

      max-width: 100%;

      color: #9c8cff;

      font-size: 12px;
      font-weight: 700;

      text-decoration: none;

      overflow-wrap: anywhere;
    }

    .message-date {
      flex-shrink: 0;

      color: var(--muted-2);

      font-size: 10px;
      line-height: 1.4;

      text-align: right;
    }

    .subject-label {
      margin-bottom: 5px;

      color: var(--muted-2);

      font-size: 10px;
      font-weight: 900;

      letter-spacing: 0.8px;

      text-transform: uppercase;
    }

    .subject {
      margin: 0 0 14px;

      color: #ececf4;

      font-size: 14px;
      font-weight: 800;
      line-height: 1.4;

      overflow-wrap: anywhere;
    }

    .message-body {
      margin: 0;

      padding: 14px;

      border: 1px solid #282834;
      border-radius: 13px;

      color: #b5b5c1;

      background:
        rgba(255, 255, 255, 0.018);

      font-size: 13px;
      line-height: 1.65;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-actions {
      display: flex;
      gap: 9px;

      margin-top: 16px;
    }

    .reply-button,
    .delete-button {
      min-height: 42px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      cursor: pointer;

      font-size: 12px;
      font-weight: 850;

      text-decoration: none;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .reply-button:active,
    .delete-button:active {
      transform: scale(0.98);
    }

    .reply-button {
      flex: 1;

      border: 0;

      color: #fff;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--blue)
        );

      box-shadow:
        0 8px 24px
        rgba(100, 92, 255, 0.18);
    }

    .delete-button {
      min-width: 78px;

      padding: 0 13px;

      border: 1px solid
        rgba(255, 77, 97, 0.25);

      color: #ff8290;

      background:
        rgba(255, 77, 97, 0.07);
    }

    .delete-button:disabled {
      opacity: 0.5;
      cursor: default;
    }


    /* EMPTY / LOADING */

    .dashboard-state {
      grid-column: 1 / -1;

      padding: 50px 20px;

      border: 1px dashed #30303d;
      border-radius: 18px;

      color: var(--muted);

      background:
        rgba(15, 15, 22, 0.55);

      text-align: center;

      font-size: 13px;
      line-height: 1.6;
    }


    /* MOBILE */

    @media (max-width: 720px) {

      .dashboard {
        padding-top: 14px;
      }

      .topbar {
        padding: 14px;
        border-radius: 17px;
      }

      .dashboard-logo {
        width: 101px;
      }

      .admin-badge {
        display: none;
      }

      #signOutButton {
        min-height: 38px;
        padding: 0 12px;
      }

      .dashboard-heading {
        align-items: flex-start;

        margin-top: 24px;
      }

      .dashboard-heading h1 {
        font-size: 24px;
      }

      .messages-list {
        grid-template-columns: 1fr;
      }

      .message-card {
        padding: 17px;

        border-radius: 17px;
      }

      .message-top {
        display: block;
      }

      .message-date {
        margin-top: 8px;

        text-align: left;
      }

      .message-actions {
        display: grid;
        grid-template-columns: 1fr auto;
      }

    }

    @media (max-width: 420px) {

      .dashboard-heading {
        display: block;
      }

      .message-count {
        width: fit-content;

        margin-top: 14px;
      }

      .login-screen {
        padding: 16px;
      }

      .admin-card {
        padding: 28px 20px;
      }

    }

  </style>
</head>

<body>


  <!-- LOGIN -->

  <section
    id="loginScreen"
    class="login-screen"
  >

    <main class="admin-card">

      <img
        class="login-logo"
        src="viral1s-logo.webp"
        alt="Viral1s"
      >

      <h1>Admin</h1>

      <p>
        Sign in with your authorized Google account.
      </p>

      <button
        id="googleLogin"
        type="button"
      >
        Continue with Google
      </button>

      <p id="status"></p>

    </main>

  </section>


  <!-- DASHBOARD -->

  <section
    id="dashboard"
    class="dashboard hidden"
  >

    <div class="dashboard-inner">


      <header class="topbar">

        <div class="topbar-left">

          <img
            class="dashboard-logo"
            src="viral1s-logo.webp"
            alt="Viral1s"
          >

          <span class="admin-badge">
            ADMIN
          </span>

        </div>

        <button
          id="signOutButton"
          type="button"
        >
          Sign out
        </button>

      </header>


      <div class="dashboard-heading">

        <div>
          <h1>Messages</h1>

          <p>
            Contact messages sent through Viral1s.
          </p>
        </div>

        <div
          id="messageCount"
          class="message-count"
        >
          0 messages
        </div>

      </div>


      <div
        id="messagesList"
        class="messages-list"
      >

        <div class="dashboard-state">
          Loading messages...
        </div>

      </div>


    </div>

  </section>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    setPersistence,
    browserLocalPersistence,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  import {
    getFirestore,
    collection,
    query,
    orderBy,
    onSnapshot,
    deleteDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyC4Qp_MUcky6di-rWBBCmBiRICaYsNXi0w",
    authDomain: "viral1s.firebaseapp.com",
    projectId: "viral1s",
    storageBucket: "viral1s.firebasestorage.app",
    messagingSenderId: "1064452367802",
    appId: "1:1064452367802:web:80dd7e24cd78d2cb55a983"
  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);

  const provider =
    new GoogleAuthProvider();


  const adminUIDs = [
    "JQkYiVQ1bhgc4i4FYAWomFkAioG3",
    "wzylH7v0wwasLo4YguCVOKsIB2v2"
  ];


  const loginScreen =
    document.getElementById("loginScreen");

  const dashboard =
    document.getElementById("dashboard");

  const googleLogin =
    document.getElementById("googleLogin");

  const status =
    document.getElementById("status");

  const signOutButton =
    document.getElementById("signOutButton");

  const messagesList =
    document.getElementById("messagesList");

  const messageCount =
    document.getElementById("messageCount");


  let unsubscribeMessages = null;


  await setPersistence(
    auth,
    browserLocalPersistence
  );


  function showLogin() {

    loginScreen.classList.remove("hidden");

    dashboard.classList.add("hidden");

    googleLogin.disabled = false;

    googleLogin.textContent =
      "Continue with Google";

  }


  function showDashboard() {

    loginScreen.classList.add("hidden");

    dashboard.classList.remove("hidden");

  }


  function formatDate(timestamp) {

    if (
      !timestamp ||
      typeof timestamp.toDate !== "function"
    ) {
      return "Just now";
    }

    const date =
      timestamp.toDate();

    return new Intl.DateTimeFormat(
      "en",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    ).format(date);

  }


  function buildGmailUrl(
    email,
    subject
  ) {

    const replySubject =
      subject
        ? `Re: ${subject}`
        : "Re: Your Viral1s message";

    return (
      "https://mail.google.com/mail/?view=cm&fs=1" +
      "&to=" +
      encodeURIComponent(email || "") +
      "&su=" +
      encodeURIComponent(replySubject)
    );

  }


  function createMessageCard(
    messageId,
    data
  ) {

    const card =
      document.createElement("article");

    card.className =
      "message-card";


    const top =
      document.createElement("div");

    top.className =
      "message-top";


    const sender =
      document.createElement("div");

    sender.className =
      "sender";


    const senderName =
      document.createElement("h2");

    senderName.className =
      "sender-name";

    senderName.textContent =
      data.name || "Unknown sender";


    const senderEmail =
      document.createElement("a");

    senderEmail.className =
      "sender-email";

    senderEmail.textContent =
      data.email || "No email";

    senderEmail.href =
      buildGmailUrl(
        data.email,
        data.subject
      );

    senderEmail.target =
      "_blank";

    senderEmail.rel =
      "noopener noreferrer";


    sender.appendChild(
      senderName
    );

    sender.appendChild(
      senderEmail
    );


    const date =
      document.createElement("div");

    date.className =
      "message-date";

    date.textContent =
      formatDate(
        data.createdAt
      );


    top.appendChild(
      sender
    );

    top.appendChild(
      date
    );


    const subjectLabel =
      document.createElement("div");

    subjectLabel.className =
      "subject-label";

    subjectLabel.textContent =
      "Subject";


    const subject =
      document.createElement("p");

    subject.className =
      "subject";

    subject.textContent =
      data.subject ||
      "No subject";


    const messageBody =
      document.createElement("p");

    messageBody.className =
      "message-body";

    messageBody.textContent =
      data.message ||
      "No message content.";


    const actions =
      document.createElement("div");

    actions.className =
      "message-actions";


    const replyButton =
      document.createElement("a");

    replyButton.className =
      "reply-button";

    replyButton.textContent =
      "Reply in Gmail";

    replyButton.href =
      buildGmailUrl(
        data.email,
        data.subject
      );

    replyButton.target =
      "_blank";

    replyButton.rel =
      "noopener noreferrer";


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-button";

    deleteButton.type =
      "button";

    deleteButton.textContent =
      "Delete";


    deleteButton.addEventListener(
      "click",
      async () => {

        const confirmed =
          window.confirm(
            "Delete this message permanently?"
          );

        if (!confirmed) {
          return;
        }


        deleteButton.disabled =
          true;

        deleteButton.textContent =
          "Deleting...";


        try {

          await deleteDoc(
            doc(
              db,
              "contact_messages",
              messageId
            )
          );

        } catch (error) {

          console.error(error);

          alert(
            "Could not delete this message."
          );

          deleteButton.disabled =
            false;

          deleteButton.textContent =
            "Delete";

        }

      }
    );


    actions.appendChild(
      replyButton
    );

    actions.appendChild(
      deleteButton
    );


    card.appendChild(
      top
    );

    card.appendChild(
      subjectLabel
    );

    card.appendChild(
      subject
    );

    card.appendChild(
      messageBody
    );

    card.appendChild(
      actions
    );


    return card;

  }


  function loadMessages() {

    if (unsubscribeMessages) {
      unsubscribeMessages();
    }


    messagesList.innerHTML = "";

    const loading =
      document.createElement("div");

    loading.className =
      "dashboard-state";

    loading.textContent =
      "Loading messages...";

    messagesList.appendChild(
      loading
    );


    const messagesQuery =
      query(
        collection(
          db,
          "contact_messages"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    unsubscribeMessages =
      onSnapshot(
        messagesQuery,

        (snapshot) => {

          messagesList.innerHTML =
            "";


          messageCount.textContent =
            snapshot.size === 1
              ? "1 message"
              : `${snapshot.size} messages`;


          if (snapshot.empty) {

            const empty =
              document.createElement("div");

            empty.className =
              "dashboard-state";

            empty.textContent =
              "No messages yet.";

            messagesList.appendChild(
              empty
            );

            return;
          }


          snapshot.forEach(
            (messageDocument) => {

              const card =
                createMessageCard(
                  messageDocument.id,
                  messageDocument.data()
                );

              messagesList.appendChild(
                card
              );

            }
          );

        },

        (error) => {

          console.error(error);

          messagesList.innerHTML =
            "";

          const errorBox =
            document.createElement("div");

          errorBox.className =
            "dashboard-state";

          errorBox.textContent =
            "Could not load messages.";

          messagesList.appendChild(
            errorBox
          );

        }
      );

  }


  async function rejectUser() {

    status.textContent =
      "Access denied. Admins only.";

    googleLogin.textContent =
      "Continue with Google";

    googleLogin.disabled =
      false;

    await signOut(auth);

  }


  function authorizeUser() {

    status.textContent =
      "";

    showDashboard();

    loadMessages();

  }


  onAuthStateChanged(
    auth,
    async (user) => {

      if (!user) {

        if (unsubscribeMessages) {

          unsubscribeMessages();

          unsubscribeMessages =
            null;

        }

        showLogin();

        return;
      }


      if (
        !adminUIDs.includes(
          user.uid
        )
      ) {

        await rejectUser();

        return;
      }


      authorizeUser();

    }
  );


  googleLogin.addEventListener(
    "click",
    async () => {

      googleLogin.disabled =
        true;

      status.textContent =
        "Opening Google sign in...";


      try {

        const result =
          await signInWithPopup(
            auth,
            provider
          );


        const user =
          result.user;


        if (
          !adminUIDs.includes(
            user.uid
          )
        ) {

          await rejectUser();

          return;
        }


        authorizeUser();


      } catch (error) {

        console.error(error);


        if (
          error.code ===
          "auth/popup-closed-by-user"
        ) {

          status.textContent =
            "Google sign in was closed.";

        } else {

          status.textContent =
            "Sign in failed. Please try again.";

        }


        googleLogin.disabled =
          false;

      }

    }
  );


  signOutButton.addEventListener(
    "click",
    async () => {

      signOutButton.disabled =
        true;

      signOutButton.textContent =
        "Signing out...";


      try {

        await signOut(auth);

      } catch (error) {

        console.error(error);

      }


      signOutButton.disabled =
        false;

      signOutButton.textContent =
        "Sign out";

    }
  );

</script>

</body>
</html>
